      modalTitle: document.getElementById('modalTitle'),
      modalDesc: document.getElementById('modalDesc'),
      modalNote: document.getElementById('modalNote'),
      raceExchange: document.getElementById('raceExchange'),
      myRaceCode: document.getElementById('myRaceCode'),
      copyRaceCodeBtn: document.getElementById('copyRaceCodeBtn'),
      opponentCodeRow: document.getElementById('opponentCodeRow'),
      opponentCodeInput: document.getElementById('opponentCodeInput'),
      submitRaceCodeBtn: document.getElementById('submitRaceCodeBtn'),
      exchangeError: document.getElementById('exchangeError'),
      modalPrimary: document.getElementById('modalPrimary'),
      modalHearts: document.getElementById('modalHearts'),
      toast: document.getElementById('toast'),
      liveRegion: document.getElementById('liveRegion')
    };

    /* =========================================================
       3. 应用状态
       ========================================================= */
    const app = {
      mode: 'solo',                   // solo | battle
      identity: 'tuoxie',             // kaikai | tuoxie
      soloConfig: { ...DEFAULT_GAME },// 上一次单机使用的棋盘规格
      battleSeed: null,               // 当前对战种子
      raceOwn: null,                  // { seed, player, seconds, code }
      raceOpponent: null,             // { seed, player, seconds, code }
      channel: null,                  // 同浏览器跨标签页同步
      modalOpen: false,
      modalType: null,                // solo-win | battle | lose
      modalPreviousFocus: null,
      modalShowTimer: null,
      modalHideTimer: null,
      toastTimer: null
    };

    let game = null;
    let cells = [];
    let resizeFrame = null;
    let lastShellWidth = 0;

    // 触屏长按状态
    let pressTimer = null;
    let pressedCell = null;
    let pressStartX = 0;
    let pressStartY = 0;
    let longPressHandled = false;
    let suppressContextUntil = 0;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    /* =========================================================
       4. 通用工具
       ========================================================= */
    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function formatTimer(seconds) {
      const safe = Math.max(0, Math.floor(seconds));
      return `${pad2(Math.floor(safe / 60))}:${pad2(safe % 60)}`;
    }

    function formatMineNumber(value) {
      const safe = clamp(value, -99, 999);
      return safe < 0
        ? '-' + String(Math.abs(safe)).padStart(2, '0')
        : String(safe).padStart(3, '0');
    }

    function announce(message) {
      dom.liveRegion.textContent = '';
      window.setTimeout(() => {
        dom.liveRegion.textContent = message;
      }, 30);
    }

    function showToast(message) {
      window.clearTimeout(app.toastTimer);
      dom.toast.textContent = message;
      dom.toast.classList.add('is-visible');
      app.toastTimer = window.setTimeout(() => {
        dom.toast.classList.remove('is-visible');
      }, 2200);
    }

    function otherPlayerName() {
      const otherKey = app.identity === 'kaikai' ? 'tuoxie' : 'kaikai';
      return PLAYERS[otherKey].name;
    }

    function getNeighbors(index) {
      const row = Math.floor(index / game.cols);
      const col = index % game.cols;
      const result = [];
      for (let dr = -1; dr <= 1; dr += 1) {
        for (let dc = -1; dc <= 1; dc += 1) {
          if (dr === 0 && dc === 0) continue;
          const nr = row + dr;
          const nc = col + dc;
          if (nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols) {
            result.push(nr * game.cols + nc);
          }
        }
      }
      return result;
    }

    /* =========================================================
       5. 种子 & 伪随机数
       ========================================================= */
    // 生成 6 位、方便口头/手输的种子码（去掉易混淆字符）。
    function generateSeedCode() {
      let result = '';
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        const values = new Uint32Array(6);
        window.crypto.getRandomValues(values);
        for (let i = 0; i < 6; i += 1) {
          result += SEED_ALPHABET[values[i] % SEED_ALPHABET.length];
        }
      } else {
        for (let i = 0; i < 6; i += 1) {
          result += SEED_ALPHABET[Math.floor(Math.random() * SEED_ALPHABET.length)];
        }
      }
      return result;
    }

    // 规范化玩家输入的种子码：去空白、转大写。
    function normalizeSeed(raw) {
      const seed = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!/^[A-Z0-9]{4,12}$/.test(seed)) return null;
      return seed;
    }

    // FNV-1a -> Mulberry32：轻量、稳定、跨浏览器结果一致。
    function hashSeed(seed) {
      let hash = 2166136261 >>> 0;
      for (let i = 0; i < seed.length; i += 1) {
        hash ^= seed.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function makeSeededRandom(seed) {
      let state = hashSeed(seed);
      return function random() {
        state = (state + 0x6D2B79F5) | 0;
        let t = Math.imul(state ^ (state >>> 15), 1 | state);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // 首点必定安全，剩余容量允许时也保护周围邻格。
    function createLogicCandidate(neighbors, mineCount, startIndex, random) {
      const total = neighbors.length;
      if (!Number.isInteger(mineCount) || mineCount < 0 || mineCount >= total ||
          !Number.isInteger(startIndex) || startIndex < 0 || startIndex >= total) return null;
      const safeZone = new Set([startIndex]);
      for (const neighbor of neighbors[startIndex]) {
        if (total - safeZone.size - 1 >= mineCount) safeZone.add(neighbor);
      }
      const pool = Array.from({ length: total }, (_, index) => index).filter((index) => !safeZone.has(index));
      if (pool.length < mineCount) return null;
    
      const mine = new Uint8Array(total);
      const nearby = new Uint8Array(total);
      for (let i = 0; i < mineCount; i += 1) {
        const j = i + Math.floor(random() * (pool.length - i));
        [pool[i], pool[j]] = [pool[j], pool[i]];
        mine[pool[i]] = 1;
        for (const neighbor of neighbors[pool[i]]) nearby[neighbor] += 1;
      }
      return { mine, nearby };
    }
    
    // 只根据已翻开的数字和总雷数推理；真实雷位只在执行翻开时验证。
    function isLogicSolvable(neighbors, candidate, startIndex, mineCount) {
      if (!candidate) return false;
      const { mine, nearby } = candidate;
      const total = neighbors.length;
      const state = new Uint8Array(total); // 0 未知，1 已翻开，2 已推定为雷
      let revealed = 0;
      let marked = 0;
    
      function open(indices) {
        const queue = indices.slice();
        for (let head = 0; head < queue.length; head += 1) {
          const index = queue[head];
          if (state[index]) continue;
          if (mine[index]) return false;
          state[index] = 1;
          revealed += 1;
          if (nearby[index] === 0) {
            for (const neighbor of neighbors[index]) {
              if (!state[neighbor]) queue.push(neighbor);
            }
          }
        }
        return true;
      }
    
      function mark(indices) {
        for (const index of indices) {
          if (!state[index]) {
            state[index] = 2;
            marked += 1;
          }
        }
      }
    
      if (!open([startIndex])) return false;
      while (revealed < total - mineCount) {
        const constraints = [];
        let progressed = false;
        for (let index = 0; index < total; index += 1) {
          if (state[index] !== 1 || nearby[index] === 0) continue;
          const unknown = [];
          let remaining = nearby[index];
          for (const neighbor of neighbors[index]) {
            if (state[neighbor] === 0) unknown.push(neighbor);
            else if (state[neighbor] === 2) remaining -= 1;
          }
          if (remaining < 0 || remaining > unknown.length) return false;
          if (!unknown.length) continue;
          if (remaining === 0) {
            if (!open(unknown)) return false;
            progressed = true;
          } else if (remaining === unknown.length) {
            mark(unknown);
            progressed = true;
          } else constraints.push({ unknown, remaining });
        }
        if (progressed) continue;
    
        // 剩余雷数为零时，其余未知格全安全；该规则同样可以手工使用。
        if (marked === mineCount) {
          const unknown = [];
          for (let index = 0; index < total; index += 1) {
            if (!state[index]) unknown.push(index);
          }
          if (!open(unknown)) return false;
          continue;
        }
    
        // A 的未知邻居包含于 B 时，B\A 中的雷数 = B 的余雷 - A 的余雷。
        // 按公共格索引约束，避免对整盘约束做平方级两两扫描。
        const byCell = Array.from({ length: total }, () => []);
        for (const constraint of constraints) {
          for (const index of constraint.unknown) byCell[index].push(constraint);
        }
        outer: for (const smaller of constraints) {
          for (const larger of byCell[smaller.unknown[0]]) {
            if (smaller.unknown.length >= larger.unknown.length ||
                !smaller.unknown.every((index) => larger.unknown.includes(index))) continue;
            const difference = larger.unknown.filter((index) => !smaller.unknown.includes(index));
            const remaining = larger.remaining - smaller.remaining;
            if (remaining === 0) {
              if (!open(difference)) return false;
            } else if (remaining === difference.length) mark(difference);
            else continue;
            progressed = true;
            break outer;
          }
        }
        if (!progressed) return false; // 需要猜测的候选一律丢弃。
      }
      return true;
    }

    async function prepareLogicBoard(target, startIndex) {
      const neighbors = target.grid.map((cell) => getNeighbors(cell.index));
      const random = target.mode === 'battle' ? makeSeededRandom('NG1:' + target.seed) : Math.random;
      // ponytail: 最多筛选 1000 盘；高密度若需更长搜索，可移到 Web Worker。
      for (let attempt = 0; attempt < 1000; attempt += 1) {
        if (attempt % 20 === 0) {
          await new Promise((resolve) => window.setTimeout(resolve, 0));
          if (game !== target) return null;
        }
        const candidate = createLogicCandidate(neighbors, target.mineCount, startIndex, random);
        if (!candidate) return null;
        if (isLogicSolvable(neighbors, candidate, startIndex, target.mineCount)) return candidate;
      }
      return null; // 不用需要猜测的棋盘兜底。
    }

    /* =========================================================
       6. 创建新游戏
       ========================================================= */
    function initNewGame({ mode, rows, cols, mines, seed = null }) {
      // 清理上一局
      stopTimer();
      window.clearTimeout(app.modalShowTimer);
      app.modalShowTimer = null;
      closeModal({ immediate: true, restoreFocus: false });
      clearFallingHearts();
      playBoardEffect();
      clearLongPress();
      longPressHandled = false;
      app.raceOwn = null;
      app.raceOpponent = null;
      hideRaceDock();
      clearSeedFeedback();
      clearCustomError();

      app.mode = mode;
      if (mode === 'battle') {
        rows = BATTLE_GAME.rows;
        cols = BATTLE_GAME.cols;
        mines = BATTLE_GAME.mines;
        app.battleSeed = seed || generateSeedCode();
      } else {
        app.battleSeed = null;
      }

      game = {
        mode,
        rows,
        cols,
        mineCount: mines,
        seed: mode === 'battle' ? app.battleSeed : null,
        startIndex: mode === 'battle' ? Math.floor(rows / 2) * cols + Math.floor(cols / 2) : null,
        grid: [],
        generating: false,
        started: false,
        startedAt: 0,
        seconds: 0,
        timerId: null,
        over: false,
        won: false,
        flagCount: 0,
        revealedSafe: 0
      };

      for (let index = 0; index < rows * cols; index += 1) {
        game.grid.push({
          index,
          row: Math.floor(index / cols),
          col: index % cols,
          mine: false,
          nearby: 0,
          revealed: false,
          flagged: false,
          shownMine: false,
          wrongFlag: false,
          hit: false
        });
      }

      // 两种模式都在首点时生成并验证；对战统一安全起点，保持种子公平。
      buildBoard();
      resetHud();
      updateModeUI();
      updateIdentityUI();
      updateSeedUI();
      updateStatus();
      dom.customizer.open = false;

      // 单机自定义区域只在单机显示
      dom.customizer.hidden = mode !== 'solo';
      dom.battlePanel.hidden = mode !== 'battle';

      requestAnimationFrame(fitBoard);
      announce(mode === 'battle'
        ? `对战模式已准备，种子 ${game.seed}，${rows} 行 ${cols} 列，${mines} 颗地雷。先点击亮框安全起点。`
        : `单机模式已准备，${rows} 行 ${cols} 列，${mines} 颗地雷。第一格安全，每局均经逻辑验证。`);

      if (mode === 'battle') {
        // 同一浏览器另一标签页若已提前完成，可以收到它广播的成绩。
        postRaceQuery();
        requestAnimationFrame(updateRaceDock);
      }
    }

    function buildBoard() {
      dom.board.innerHTML = '';
      cells = new Array(game.grid.length);
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < game.grid.length; index += 1) {
        const cell = game.grid[index];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'cell';
        if (index === game.startIndex) button.classList.add('is-start');
        button.dataset.index = String(index);
        button.tabIndex = index === (game.startIndex ?? 0) ? 0 : -1;
        setCellLabel(button, cell);
        cells[index] = button;
        fragment.appendChild(button);
      }

      dom.board.style.setProperty('--cols', String(game.cols));
      dom.board.setAttribute(
        'aria-label',
        `扫雷棋盘，${game.rows} 行 ${game.cols} 列，共 ${game.mineCount} 颗地雷`
      );
      dom.board.classList.remove('is-over', 'is-cleared');
      dom.board.classList.remove('is-generating');
      dom.board.removeAttribute('aria-busy');
      dom.board.appendChild(fragment);
      fitBoard();
    }

    function resetHud() {
      dom.timer.textContent = '00:00';
      dom.timer.setAttribute('aria-label', '计时器 0 秒');
      dom.mineCounter.textContent = formatMineNumber(game.mineCount);
      dom.mineCounter.setAttribute('aria-label', `剩余 ${game.mineCount} 颗地雷`);
    }

    function updateModeUI() {
      const isSolo = app.mode === 'solo';
      dom.soloTab.setAttribute('aria-pressed', isSolo ? 'true' : 'false');
      dom.battleTab.setAttribute('aria-pressed', isSolo ? 'false' : 'true');
      dom.battlePanel.hidden = !isSolo ? false : true;
      dom.customizer.hidden = !isSolo;
    }

    function switchMode(mode) {
      if (!game || mode === app.mode) return;
      app.mode = mode;

      if (mode === 'battle') {
        const seed = generateSeedCode();
        initNewGame({ mode: 'battle', ...BATTLE_GAME, seed });
      } else {
        const config = app.soloConfig;
        initNewGame({ mode: 'solo', ...config });
      }
    }

    /* =========================================================
       7. 尺寸适配
       ========================================================= */
    function fitBoard() {
      if (!game || !cells.length) return;

      const shellStyles = window.getComputedStyle(dom.boardShell);
      const horizontalPadding =
        parseFloat(shellStyles.paddingLeft) + parseFloat(shellStyles.paddingRight);
      const available = Math.max(160, dom.boardShell.clientWidth - horizontalPadding - 8);
      const gap = available < 500 ? 4 : 5;
      const minCell = 16;
      // 列数少时可以稍微放大一点，但 20×20 保持紧凑、整盘可见。
      const maxCell = game.cols <= 10 ? 44 : game.cols <= 16 ? 34 : 30;
      const rawCell = Math.floor((available - (game.cols - 1) * gap) / game.cols);
      const size = clamp(rawCell, minCell, maxCell);

      dom.board.style.setProperty('--gap', `${gap}px`);
      dom.board.style.setProperty('--cell', `${size}px`);
      dom.board.style.setProperty('--cols', String(game.cols));
    }

    /* =========================================================
       8. 渲染单格
       ========================================================= */
    function setCellLabel(element, cell) {
      const position = `第 ${cell.row + 1} 行，第 ${cell.col + 1} 列`;
      let stateText;

      if (cell.hit) stateText = '踩中的小熊猫';
      else if (cell.wrongFlag) stateText = '放错位置的小苹果';
      else if (cell.flagged) stateText = '放了小苹果';
      else if (cell.shownMine) stateText = '小熊猫地雷';
      else if (cell.revealed) stateText = cell.nearby > 0 ? `数字 ${cell.nearby}` : '空白';
      else if (!game.started && cell.index === game.startIndex) stateText = '安全起点，先从这里开始';
      else stateText = '未翻开';

      element.setAttribute('aria-label', `${position}，${stateText}`);
    }

    function renderCell(index, animateOpen = false) {
      const cell = game.grid[index];
      const element = cells[index];
      if (!cell || !element) return;

      element.className = 'cell';
      setCellLabel(element, cell);

      let content = '';

      if (cell.revealed && cell.nearby > 0) {
        content = `<span class="cell-content"><span class="cell-number n${cell.nearby}">${cell.nearby}</span></span>`;
      } else if (cell.flagged) {
        content = `<span class="cell-content">${ICON_MARKUP.slipper('cell-icon slipper-icon')}</span>`;
      } else if (cell.shownMine) {
        content = `<span class="cell-content">${ICON_MARKUP.panda('cell-icon panda-icon')}</span>`;
      } else if (cell.revealed) {
        content = '<span class="cell-content"></span>';
      }

      if (cell.revealed) element.classList.add('is-revealed');
      if (cell.flagged) element.classList.add('is-flagged');
      if (cell.wrongFlag) element.classList.add('is-wrong');
      if (cell.shownMine) element.classList.add('is-mine');
      if (cell.hit) element.classList.add('is-hit');

      if (cell.wrongFlag) {
        content += '<span class="wrong-mark" aria-hidden="true">×</span>';
      }

      element.innerHTML = content;

      if (animateOpen) {
        element.classList.add('just-opened');
        const order = Number(element.dataset.openOrder || 0);
        element.style.setProperty('--reveal-delay', `${Math.min(order * 9, 220)}ms`);
      }

      if (cell.shownMine && !cell.revealed) {
        const delay = Math.min((index % 14) * 12, 160);
        element.style.setProperty('--mine-delay', `${delay}ms`);
      }
    }

    function updateMineCounter(bump = false) {
      const remaining = game.mineCount - game.flagCount;
      dom.mineCounter.textContent = formatMineNumber(remaining);
      dom.mineCounter.setAttribute(
        'aria-label',
        remaining >= 0
          ? `剩余 ${remaining} 颗地雷`
          : `拖鞋标记比地雷数多 ${Math.abs(remaining)} 个`
      );

      if (bump) {
        dom.mineCounter.classList.remove('bump');
        void dom.mineCounter.offsetWidth;
        dom.mineCounter.classList.add('bump');
      }
    }

    function updateTimerDisplay() {
      dom.timer.textContent = formatTimer(game.seconds);
      dom.timer.setAttribute('aria-label', `计时器 ${game.seconds} 秒`);
    }

    function updateStatus() {
      if (!game || game.over) return;

      if (!game.started) {
        setStatus(
          game.mode === 'battle'
            ? '先点亮框安全起点 · 同盘推理，用时更短者胜'
            : '第一格安全 · 每局均经逻辑验证，无需猜雷',
          'idle'
        );
        return;
      }

      const safeTotal = game.rows * game.cols - game.mineCount;
      setStatus(
        game.mode === 'battle'
          ? `已翻开 ${game.revealedSafe} / ${safeTotal} 格 · ${PLAYERS[app.identity].name}加油`
          : `已翻开 ${game.revealedSafe} / ${safeTotal} 格 · 慢慢来`,
        'play'
      );
    }

    function setStatus(text, mood) {
      dom.statusLabel.textContent = text;
      dom.statusText.dataset.mood = mood;
    }

    /* =========================================================
       9. 计时器
       ========================================================= */
    function startTimer() {
      game.started = true;
      game.startedAt = Date.now();
      updateIdentityUI(true);

      game.timerId = window.setInterval(() => {
        if (!game || !game.started || game.over) return;
        const elapsed = Math.floor((Date.now() - game.startedAt) / 1000);
        if (elapsed !== game.seconds) {
          game.seconds = elapsed;
          updateTimerDisplay();
        }
      }, 200);
    }

    function stopTimer() {
      if (!game) return;
      if (game.timerId) {
        window.clearInterval(game.timerId);
        game.timerId = null;
      }
      if (game.started && game.startedAt) {
        game.seconds = Math.max(0, Math.floor((Date.now() - game.startedAt) / 1000));
        updateTimerDisplay();
      }
    }

    /* =========================================================
       10. 翻开 / 标记 / 空白扩散
       ========================================================= */
    async function revealCell(index) {
      if (!game || game.over || game.generating) return;
      const cell = game.grid[index];
      if (!cell || cell.revealed || cell.flagged) return;

      if (!game.started) {
        if (game.mode === 'battle' && index !== game.startIndex) {
          showToast('请先点击亮框安全起点，双方从同一格开始');
          focusCell(game.startIndex);
          return;
        }
        const target = game;
        target.generating = true;
        dom.board.classList.add('is-generating');
        dom.board.setAttribute('aria-busy', 'true');
        updateIdentityUI();
        setStatus('正在准备可推理的雷区… 此时不计时', 'idle');
        try {
          const candidate = await prepareLogicBoard(target, index);
          if (game !== target) return;
          if (!candidate) {
            const message = '暂未找到无需猜测的棋盘，请减少雷数或重新开始';
            setStatus(message, 'idle');
            announce(message);
            return;
          }
          target.grid.forEach((item, position) => {
            item.mine = Boolean(candidate.mine[position]);
            item.nearby = candidate.nearby[position];
          });
        } catch (error) {
          if (game === target) {
            setStatus('棋盘准备失败，请重新开始', 'idle');
            showToast('棋盘准备失败，请重新开始');
          }
          console.error(error);
          return;
        } finally {
          if (game === target) {
            target.generating = false;
            dom.board.classList.remove('is-generating');
            dom.board.removeAttribute('aria-busy');
            updateIdentityUI();
          }
        }
        startTimer();
      }

      if (cell.mine) {
        loseGame(index);
        return;
      }

      openSafeArea(index);
      checkWin();
      if (!game.over) updateStatus();
    }

    function playBoardEffect(effect = '') {
      const shell = dom.boardShell;
      // 一次展开可能连开多个区域；晃动期间合并反馈，胜负反馈始终优先。
      if (effect === 'open' && shell.dataset.effect) return;
      delete shell.dataset.effect;
      shell.onanimationend = null;
      if (!effect || reducedMotion.matches) return;
      void shell.offsetWidth;
      shell.dataset.effect = effect;
      shell.onanimationend = (event) => {
        if (event.target !== shell || event.pseudoElement) return;
        delete shell.dataset.effect;
        shell.onanimationend = null;
      };
    }

    function openSafeArea(startIndex) {
      const queue = [startIndex];
      let head = 0;
      const seen = new Set(queue);
      const opened = [];

      while (head < queue.length) {
        const index = queue[head];
        head += 1;
        const cell = game.grid[index];
        if (cell.revealed || cell.flagged || cell.mine) continue;

        cell.revealed = true;
        game.revealedSafe += 1;
        opened.push(index);

        if (cell.nearby === 0) {
          for (const neighbor of getNeighbors(index)) {
            if (!seen.has(neighbor)) {
              const next = game.grid[neighbor];
              if (!next.revealed && !next.flagged && !next.mine) {
                seen.add(neighbor);
                queue.push(neighbor);
              }
            }
          }
        }
      }

      // 先标记顺序，再渲染，让相邻翻开的格子轻微递进淡入。
      opened.forEach((index, order) => {
        cells[index].dataset.openOrder = String(order);
        renderCell(index, true);
      });
      if (opened.some((index) => game.grid[index].nearby === 0)) playBoardEffect('open');
      updateMineCounter(false);
    }

    function toggleFlag(index) {
      if (!game || game.over || game.generating) return;
      const cell = game.grid[index];
      if (!cell || cell.revealed) return;
      if (!game.started && index === game.startIndex) {
        showToast('这是安全起点，轻点翻开即可');
        return;
      }

      cell.flagged = !cell.flagged;
      game.flagCount += cell.flagged ? 1 : -1;
      renderCell(index);
      updateMineCounter(true);
      updateStatus();

      announce(cell.flagged
        ? `第 ${cell.row + 1} 行，第 ${cell.col + 1} 列放上了小苹果。`
        : `第 ${cell.row + 1} 行，第 ${cell.col + 1} 列收起了小苹果。`);
    }

    function chordReveal(index) {
      if (!game || game.over || !game.started) return;
      const cell = game.grid[index];
      if (!cell || !cell.revealed || cell.nearby === 0) return;

      const neighbors = getNeighbors(index);
      const flagCount = neighbors.filter((i) => game.grid[i].flagged).length;
      if (flagCount !== cell.nearby) {
        const element = cells[index];
        element.classList.remove('is-nope');
        void element.offsetWidth;
        element.classList.add('is-nope');
        window.setTimeout(() => element.classList.remove('is-nope'), 260);
        return;
      }

      const hidden = neighbors.filter((i) => !game.grid[i].revealed && !game.grid[i].flagged);
      if (!hidden.length) return;

      const mine = hidden.find((i) => game.grid[i].mine);
      if (mine !== undefined) {
        loseGame(mine);
        return;
      }

      hidden.forEach((i) => openSafeArea(i));
      checkWin();
      if (!game.over) updateStatus();
    }

    function checkWin() {
      if (!game || game.over) return;
      const safeTotal = game.rows * game.cols - game.mineCount;
      if (game.revealedSafe >= safeTotal) winGame();
    }

    /* =========================================================
       11. 胜负处理
       ========================================================= */
    function loseGame(hitIndex) {
      if (!game || game.over) return;
      game.over = true;
      game.won = false;
      stopTimer();
      updateIdentityUI();

      const hitCell = game.grid[hitIndex];
      if (hitCell) {
        hitCell.hit = true;
        hitCell.shownMine = true;
      }

      game.grid.forEach((cell) => {
        if (cell.mine) cell.shownMine = true;
        if (cell.flagged && !cell.mine) cell.wrongFlag = true;
      });

      game.grid.forEach((cell, index) => {
        if (cell.hit || cell.wrongFlag || (cell.shownMine && !cell.revealed && !cell.flagged)) {
          renderCell(index);
        }
      });

      dom.board.classList.add('is-over');
      playBoardEffect('lose');
      setStatus('踩到小熊猫啦，拍拍灰再来一次吧', 'lose');
      dom.mineCounter.classList.remove('bump');

      announce(`踩到地雷，游戏结束。本局用时 ${game.seconds} 秒。`);

      window.clearTimeout(app.modalShowTimer);
      app.modalShowTimer = window.setTimeout(() => {
        if (game && game.over && !game.won) openModal('lose');
      }, 720);
    }

    function winGame() {
      if (!game || game.over) return;
      game.over = true;
      game.won = true;
      stopTimer();
      updateIdentityUI();

      // 胜利时自动为所有地雷盖上小苹果。
      game.grid.forEach((cell, index) => {
        if (cell.mine && !cell.flagged) {
          cell.flagged = true;
          game.flagCount += 1;
          renderCell(index);
        }
      });
      game.flagCount = game.mineCount;

      updateMineCounter(false);
      dom.board.classList.add('is-over', 'is-cleared');
      playBoardEffect('win');
      setStatus(`全部清空啦！用时 ${game.seconds} 秒`, 'win');
      spawnFallingHearts();
      announce(`全部安全格都翻开啦！用时 ${game.seconds} 秒。`);

      if (game.mode === 'battle') {
        recordOwnRaceResult();
      }

      window.clearTimeout(app.modalShowTimer);
      app.modalShowTimer = window.setTimeout(() => {
        if (!game || !game.over || !game.won) return;
        if (game.mode === 'battle') openBattleResultModal();
        else openModal('solo-win');
      }, 720);
    }

    /* =========================================================
       12. 对战：战绩码 & 跨标签同步
       ========================================================= */
    function encodeRaceResult(result) {
      return `NG1-${result.seed}-${PLAYERS[result.player].code}-${result.seconds}`;
    }

    function decodeRaceResult(raw) {
      const code = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
      const match = code.match(/^NG1-([A-Z0-9]{4,12})-([KT])-(\d{1,5})$/);
      if (!match) return null;

      const player = PLAYER_KEYS.find((key) => PLAYERS[key].code === match[2]);
      if (!player) return null;

      const seconds = Number(match[3]);
      if (!Number.isInteger(seconds) || seconds < 0) return null;

      return {
        seed: match[1],
        player,
        seconds,
        code: `NG1-${match[1]}-${match[2]}-${seconds}`
      };
    }

    function recordOwnRaceResult() {
      if (!game || game.mode !== 'battle' || !game.seed) return;

      const result = {
        seed: game.seed,
        player: app.identity,
        seconds: game.seconds
      };
      result.code = encodeRaceResult(result);
      app.raceOwn = result;
      updateRaceDock();
      postRaceResult(result);
    }

    function acceptOpponentResult(result, { fromRemote = false } = {}) {
      if (!game || game.mode !== 'battle' || !game.seed) return false;
      if (!result || result.seed !== game.seed) return false;
      if (!PLAYER_KEYS.includes(result.player) || result.player === app.identity) return false;
      if (!Number.isInteger(result.seconds) || result.seconds < 0) return false;

      const normalized = {
        seed: result.seed,
        player: result.player,
        seconds: result.seconds,
        code: encodeRaceResult(result)
      };

      // 已经结算过相同成绩就不重复操作
      if (
        app.raceOpponent &&
        app.raceOpponent.player === normalized.player &&
        app.raceOpponent.seconds === normalized.seconds
      ) {
        return true;
      }

      app.raceOpponent = normalized;
      updateRaceDock();

      if (game.over && game.won) {
        if (app.modalOpen && app.modalType === 'battle') {
          // 弹窗正开着：直接自动更新为最终结算
          renderBattleModalContent();
          announce('收到对方的战绩，对战结果已经自动结算。');
        } else if (app.modalOpen && app.modalType !== 'battle') {
          // 其他弹窗时不打扰
        } else {
          showToast(`收到${PLAYERS[normalized.player].name}的战绩，点“查看结算”看结果`);
          announce(`收到${PLAYERS[normalized.player].name}的战绩，可以查看对战结算了。`);
        }
      }

      if (fromRemote) {
        showToast(`${PLAYERS[normalized.player].name} 的成绩已同步`);
      }
      return true;
    }

    function initRaceChannel() {
      if (!('BroadcastChannel' in window)) return;
      try {
        app.channel = new BroadcastChannel(RACE_CHANNEL_NAME);
        app.channel.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || !data.type) return;

          if (data.type === 'race-result') {
            acceptOpponentResult(data.result, { fromRemote: true });
          } else if (data.type === 'race-query') {
            // 新开的标签页询问当前种子是否已有战绩
            if (
              game &&
              game.mode === 'battle' &&
              game.seed === data.seed &&
              app.raceOwn &&
              data.player !== app.identity
            ) {
              postRaceResult(app.raceOwn);
            }
          }
        });
      } catch (error) {
        app.channel = null;
      }
    }

    function postRaceResult(result) {
      if (!app.channel) return;
      try {
        app.channel.postMessage({ type: 'race-result', result });
      } catch (error) {
        // BroadcastChannel 不可用时，仍可使用手动战绩码。
      }
    }

    function postRaceQuery() {
      if (!app.channel || !game || game.mode !== 'battle' || !game.seed) return;
      try {
        app.channel.postMessage({
          type: 'race-query',
          seed: game.seed,
          player: app.identity
        });
      } catch (error) {
        // 静默失败
      }
    }

    function getRaceResultsMap() {
      const map = {};
      [app.raceOwn, app.raceOpponent].forEach((result) => {
        if (result && result.seed === game?.seed) map[result.player] = result;
      });
      return map;
    }

    function getBattleSettlement() {
      if (!game || game.mode !== 'battle' || !game.seed) return null;
      const results = getRaceResultsMap();
      if (!results.kaikai || !results.tuoxie) return null;

      const kaikaiTime = results.kaikai.seconds;
      const tuoxieTime = results.tuoxie.seconds;
      let winner = null;
      if (kaikaiTime < tuoxieTime) winner = 'kaikai';
      else if (tuoxieTime < kaikaiTime) winner = 'tuoxie';

      const times = `凯凯用时 ${kaikaiTime} 秒｜拖鞋用时 ${tuoxieTime} 秒`;
      const body = winner
        ? `${PLAYERS[winner].name} 赢啦！${times}`
        : `平局啦！${times}`;

      return {
        winner,
        body,
        seed: game.seed,
        kaikaiTime,
        tuoxieTime
      };
    }

    function updateRaceDock() {
      if (!game || game.mode !== 'battle' || !app.raceOwn) {
        hideRaceDock();
        return;
      }

      const settlement = getBattleSettlement();
      dom.raceDock.hidden = false;
      dom.raceDockText.textContent = settlement
        ? (settlement.winner
            ? `已结算 · ${PLAYERS[settlement.winner].name}赢啦`
            : '已结算 · 平局')
        : `本轮成绩 ${app.raceOwn.seconds} 秒 · 等待对手`;
    }

    function hideRaceDock() {
      dom.raceDock.hidden = true;
      dom.raceDockText.textContent = '';
    }

    /* =========================================================
       13. 顶部 / 模式 / 种子 UI
       ========================================================= */
    function updateIdentityUI(lock = false) {
      const shouldLock = lock || Boolean(game && (game.started || game.generating));
      dom.identityButtons.forEach((button) => {
        const selected = button.dataset.player === app.identity;
        button.setAttribute('aria-pressed', selected ? 'true' : 'false');
        button.disabled = shouldLock;
        button.title = shouldLock ? '本局已开始，重新开始后可切换身份' : '';
      });
    }

    function updateSeedUI() {
      const isBattle = app.mode === 'battle';
      dom.activeSeed.textContent = isBattle && app.battleSeed ? app.battleSeed : '—';
      dom.copySeedBtn.disabled = !(isBattle && app.battleSeed);
      dom.generateSeedBtn.disabled = !isBattle;
      dom.seedInput.disabled = !isBattle;
      dom.joinSeedBtn.disabled = !isBattle;
    }

    function setIdentity(player) {
      if (!PLAYER_KEYS.includes(player)) return;
      if (game && (game.started || game.generating)) {
        showToast('本局已经开始啦，重新开始后再切换身份');
        return;
      }
      app.identity = player;
      updateIdentityUI();
      updateRaceDock();
      if (game && game.mode === 'battle') {
        // 身份变了以后，之前残留的对手成绩不再适用
        app.raceOpponent = null;
        hideRaceDock();
        postRaceQuery();
      }
      announce(`当前身份：${PLAYERS[player].name}`);
    }

    function clearSeedFeedback() {
      dom.seedFeedback.hidden = true;
      dom.seedFeedback.textContent = '';
      dom.seedInput.classList.remove('is-error');
    }

    function showSeedFeedback(message) {
      dom.seedFeedback.hidden = false;
      dom.seedFeedback.textContent = message;
      dom.seedInput.classList.add('is-error');
    }

    function clearCustomError() {
      dom.customError.hidden = true;
      dom.customError.textContent = '';
      [dom.rowsInput, dom.colsInput, dom.minesInput].forEach((input) => {
        input.classList.remove('is-invalid');
        input.removeAttribute('aria-invalid');
      });
    }

    function showCustomError(message, input) {
      clearCustomError();
      dom.customError.hidden = false;
      dom.customError.textContent = message;
      if (input) {
        input.classList.add('is-invalid');
        input.setAttribute('aria-invalid', 'true');
        input.focus();
      }
    }

    function validateCustomSettings() {
      const rows = Number(dom.rowsInput.value);
      const cols = Number(dom.colsInput.value);
      const mines = Number(dom.minesInput.value);

      if (!Number.isInteger(rows) || rows < LIMITS.minRows || rows > LIMITS.maxRows) {
        showCustomError(`行数需要在 ${LIMITS.minRows}–${LIMITS.maxRows} 之间`, dom.rowsInput);
        return null;
      }
      if (!Number.isInteger(cols) || cols < LIMITS.minCols || cols > LIMITS.maxCols) {
        showCustomError(`列数需要在 ${LIMITS.minCols}–${LIMITS.maxCols} 之间`, dom.colsInput);
        return null;
      }

      const maxMines = rows * cols - 1;
      if (!Number.isInteger(mines) || mines < LIMITS.minMines || mines > maxMines) {
        showCustomError(`这个棋盘的地雷数需要在 1–${maxMines} 之间`, dom.minesInput);
        return null;
      }

      return { rows, cols, mines };
    }

    function syncCustomInputs(config) {
      dom.rowsInput.value = String(config.rows);
      dom.colsInput.value = String(config.cols);
      dom.minesInput.value = String(config.mines);
    }

    /* =========================================================
       14. 弹窗
       ========================================================= */
    function openBattleResultModal() {
      if (!game || game.mode !== 'battle' || !app.raceOwn) return;
      openModal('battle');
    }

    function openModal(type) {
      if (!game) return;

      window.clearTimeout(app.modalShowTimer);
      app.modalShowTimer = null;
      app.modalType = type;
      app.modalPreviousFocus = document.activeElement;
      renderModalContent();

      dom.modal.hidden = false;
      document.body.classList.add('has-modal');
      dom.page.inert = true;

      if (type === 'solo-win' || type === 'battle') {
        spawnModalHearts();
      } else {
        dom.modalHearts.innerHTML = '';
      }

      window.clearTimeout(app.modalHideTimer);
      void dom.modal.offsetWidth;
      dom.modal.classList.add('is-open');
      app.modalOpen = true;

      window.setTimeout(() => {
        if (app.modalOpen) dom.modalPrimary.focus({ preventScroll: true });
      }, 150);
    }

    function renderModalContent() {
      const type = app.modalType;
      dom.raceExchange.hidden = true;
      dom.exchangeError.hidden = true;

      if (type === 'lose') {
        dom.modalCard.classList.remove('is-win');
        dom.modalCard.classList.add('is-lose');
        dom.modalMascot.innerHTML = ICON_MARKUP.panda('modal-art');
        dom.modalTitle.textContent = 'ohno💥踩到地雷啦凯凯！';
        dom.modalDesc.textContent = '这下不舒服惹555';
        dom.modalNote.textContent = '';
        dom.modalPrimary.textContent = '重新试试';
        return;
      }

      dom.modalCard.classList.add('is-win');
      dom.modalCard.classList.remove('is-lose');
      dom.modalMascot.innerHTML = ICON_MARKUP.heart('modal-art');

      if (type === 'solo-win') {
        dom.modalTitle.textContent = '太棒啦！🎉';
        dom.modalDesc.textContent = `这一局全部清空啦，用时 ${game.seconds} 秒。整片雷区都变得软乎乎啦！`;
        dom.modalNote.textContent = '可以再来一局哦';
        dom.modalPrimary.textContent = '再来一局';
        return;
      }

      if (type === 'battle') {
        dom.modalTitle.textContent = '太棒啦！🎉';
        dom.modalPrimary.textContent = '再来一局';

        const settlement = getBattleSettlement();
        // 结算后仍保留自己的战绩码，方便另一台设备完成结算。
        dom.raceExchange.hidden = false;
        dom.myRaceCode.textContent = app.raceOwn.code;
        dom.opponentCodeRow.hidden = Boolean(settlement);
        if (settlement) {
          // 最终对战结算：严格使用约定文案
          dom.modalDesc.textContent = settlement.body;
          dom.modalNote.textContent = `本局种子：${settlement.seed}，可以再来一局哦`;
          return;
        }

        // 只有自己完成、对手成绩还没到时，显示交换战绩码的区域。
        dom.modalDesc.textContent =
          `你用时 ${app.raceOwn.seconds} 秒完成啦！把战绩码发给${otherPlayerName()}，` +
          `等 TA 也完成后，粘贴 TA 的战绩码就能自动判定赢家。`;
        dom.modalNote.textContent = `本局种子：${game.seed}，可以再来一局哦`;
        dom.opponentCodeInput.value = '';
        dom.exchangeError.hidden = true;
      }
    }

    function renderBattleModalContent() {
      if (app.modalType !== 'battle') return;
      const hadInputFocus = dom.opponentCodeRow.contains(document.activeElement);
      renderModalContent();
      // 录入框隐藏时，将其中的焦点移回主按钮；保留复制按钮的焦点。
      if (app.modalOpen && dom.opponentCodeRow.hidden && hadInputFocus) {
        dom.modalPrimary.focus({ preventScroll: true });
      }
    }

    function closeModal({ immediate = false, restoreFocus = true } = {}) {
      if (!app.modalOpen && dom.modal.hidden) return;

      window.clearTimeout(app.modalHideTimer);
      app.modalOpen = false;
      dom.modal.classList.remove('is-open');
      document.body.classList.remove('has-modal');
      dom.page.inert = false;
      app.modalType = null;

      if (immediate) {
        dom.modal.hidden = true;
        dom.modalHearts.innerHTML = '';
      } else {
        app.modalHideTimer = window.setTimeout(() => {
          dom.modal.hidden = true;
          dom.modalHearts.innerHTML = '';
        }, 320);
      }

      if (restoreFocus) {
        const target = app.modalPreviousFocus && document.contains(app.modalPreviousFocus)
          ? app.modalPreviousFocus
          : dom.resetBtn;
        window.setTimeout(() => {
          if (target && typeof target.focus === 'function') {
            target.focus({ preventScroll: true });
          }
        }, immediate ? 0 : 330);
      }
      app.modalPreviousFocus = null;
    }

    function trapModalFocus(event) {
      if (!app.modalOpen) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        closeModal();
        return;
      }

      if (event.key !== 'Tab') return;

      const focusables = Array.from(
        dom.modal.querySelectorAll('button:not([disabled]), input:not([disabled])')
      ).filter((el) => el.offsetParent !== null);

      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function submitOpponentCode() {
      const parsed = decodeRaceResult(dom.opponentCodeInput.value);
      if (!parsed) {
        dom.exchangeError.hidden = false;
        dom.exchangeError.textContent = '战绩码格式不对，请检查后重试';
        return;
      }
      if (parsed.seed !== game.seed) {
        dom.exchangeError.hidden = false;
        dom.exchangeError.textContent = '这颗种子不是本局的哦';
        return;
      }
      if (parsed.player === app.identity) {
        dom.exchangeError.hidden = false;
        dom.exchangeError.textContent = '这是你自己的战绩码呀';
        return;
      }

      dom.exchangeError.hidden = true;
      const accepted = acceptOpponentResult(parsed);
      if (!accepted) {
        dom.exchangeError.hidden = false;
        dom.exchangeError.textContent = '这边暂时无法识别这个战绩码';
        return;
      }

      renderBattleModalContent();
      showToast('对手成绩已录入，已自动结算');
      announce('对手成绩已录入，对战结果已经自动结算。');
    }

    /* =========================================================
       15. 爱心动画 & 复制
       ========================================================= */
    function spawnModalHearts() {
      dom.modalHearts.innerHTML = '';
      if (reducedMotion.matches) return;

      const colors = ['#d9a6a0', '#b7d2df', '#e2b9b2', '#c4dae6'];
      for (let i = 0; i < 14; i += 1) {
        const heart = document.createElement('span');
        const duration = 5 + Math.random() * 4;
        heart.className = 'modal-heart';
        heart.style.left = `${4 + Math.random() * 90}%`;
        heart.style.width = `${10 + Math.random() * 12}px`;
        heart.style.height = `${10 + Math.random() * 12}px`;
        heart.style.color = colors[i % colors.length];
        // 负延迟让爱心在弹窗出现时就已经分布在空中，不会一开始空空的。
        heart.style.animationDelay = `-${(Math.random() * duration).toFixed(2)}s`;
        heart.style.animationDuration = `${duration}s`;
        heart.style.setProperty('--heart-drift', `${Math.random() * 40 - 20}px`);
        heart.innerHTML = ICON_MARKUP.heart('heart-svg');
        dom.modalHearts.appendChild(heart);
      }
    }

    function spawnFallingHearts() {
      dom.fallingHearts.innerHTML = '';
      if (reducedMotion.matches) return;

      const colors = ['rgba(174, 206, 223, .8)', 'rgba(226, 181, 185, .72)', 'rgba(201, 222, 234, .66)'];
      for (let i = 0; i < 18; i += 1) {
        const heart = document.createElement('span');
        heart.className = 'falling-heart';
        heart.style.left = `${3 + Math.random() * 94}%`;
        heart.style.width = `${12 + Math.random() * 15}px`;
        heart.style.height = `${12 + Math.random() * 15}px`;
        heart.style.color = colors[i % colors.length];
        heart.style.animationDelay = `${i < 5 ? Math.random() * .35 : Math.random() * 3.5}s`;
        heart.style.animationDuration = `${7 + Math.random() * 5}s`;
        heart.style.setProperty('--heart-drift', `${Math.random() * 100 - 50}px`);
        heart.innerHTML = ICON_MARKUP.heart('heart-svg');
        dom.fallingHearts.appendChild(heart);
      }
    }

    function clearFallingHearts() {
      dom.fallingHearts.innerHTML = '';
    }

    async function copyText(text) {
      if (!text) return false;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        // 某些内嵌 iframe / file:// 环境下 Clipboard API 不可用，走兜底。
      }

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const succeeded = document.execCommand('copy');
        document.body.removeChild(textarea);
        return succeeded;
      } catch (error) {
        return false;
      }
    }

    /* =========================================================
       16. 键盘 & 触屏长按
       ========================================================= */
    function clearLongPress() {
      if (pressTimer) {
        window.clearTimeout(pressTimer);
        pressTimer = null;
      }
      if (pressedCell) {
        pressedCell.classList.remove('is-holding');
        pressedCell = null;
      }
    }

    function focusCell(index) {
      const target = cells[index];
      if (!target) return;
      cells.forEach((cell) => { cell.tabIndex = -1; });
      target.tabIndex = 0;
      target.focus({ preventScroll: true });
      target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    /* =========================================================
       17. 事件绑定
       ========================================================= */
    function bindEvents() {
      // 模式切换
      document.querySelectorAll('.mode-tab').forEach((tab) => {
        tab.addEventListener('click', () => switchMode(tab.dataset.mode));
      });

      // 身份选择
      dom.identityButtons.forEach((button) => {
        button.addEventListener('click', () => setIdentity(button.dataset.player));
      });

      // 生成种子 / 复制种子 / 加入对局
      dom.generateSeedBtn.addEventListener('click', () => {
        const seed = generateSeedCode();
        clearSeedFeedback();
        app.mode = 'battle';
        initNewGame({ mode: 'battle', ...BATTLE_GAME, seed });
        showToast(`新种子 ${seed} 已生成，请复制并发给${otherPlayerName()}加入新局`);
      });

      dom.copySeedBtn.addEventListener('click', async () => {
        if (!app.battleSeed) return;
        const copied = await copyText(app.battleSeed);
        showToast(copied
          ? `种子 ${app.battleSeed} 已复制，快发给${otherPlayerName()}吧`
          : `复制失败，请手动记下种子：${app.battleSeed}`);
      });

      dom.seedJoinForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const seed = normalizeSeed(dom.seedInput.value);
        if (!seed) {
          showSeedFeedback('种子码需要是 4–12 位字母或数字');
          dom.seedInput.focus();
          return;
        }
        clearSeedFeedback();
        dom.seedInput.value = seed;
        if (game && game.mode === 'battle' && game.seed === seed) {
          showToast('已经在本局中；重赛请生成新种子并分享给对方');
          return;
        }
        app.mode = 'battle';
        initNewGame({ mode: 'battle', ...BATTLE_GAME, seed });
        showToast(`已加入种子 ${seed} 的对局`);
      });

      dom.seedInput.addEventListener('input', clearSeedFeedback);

      // 对战结果重新打开
      dom.openRaceResultBtn.addEventListener('click', openBattleResultModal);

      // 重新开始：对战使用新种子区分新一局，避免接收上一局成绩。
      dom.resetBtn.addEventListener('click', () => {
        if (!game) return;
        if (game.mode === 'battle') {
          dom.generateSeedBtn.click();
        } else {
          initNewGame({ mode: 'solo', rows: game.rows, cols: game.cols, mines: game.mineCount });
        }
      });

      // 单机自定义棋盘
      dom.customForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const config = validateCustomSettings();
        if (!config) return;

        app.soloConfig = config;
        app.mode = 'solo';
        initNewGame({ mode: 'solo', ...config });
      });

      [dom.rowsInput, dom.colsInput, dom.minesInput].forEach((input) => {
        input.addEventListener('input', () => {
          input.classList.remove('is-invalid');
          input.removeAttribute('aria-invalid');
          if (!dom.customError.hidden) clearCustomError();
        });
      });

      // 棋盘点击 / 右键 / 双击
      dom.board.addEventListener('click', (event) => {
        if (!game || game.over) return;
        // 长按已完成标记操作，吞掉这次手势松手后的点击；键盘激活仍可用。
        if (longPressHandled && event.detail > 0) {
          event.preventDefault();
          return;
        }
        const target = event.target.closest('.cell');
        if (!target) return;
        revealCell(Number(target.dataset.index));
      });

      dom.board.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        if (!game || game.over) return;
        if (longPressHandled || Date.now() < suppressContextUntil) return;
        const target = event.target.closest('.cell');
        if (!target) return;
        toggleFlag(Number(target.dataset.index));
      });

      dom.board.addEventListener('dblclick', (event) => {
        if (!game || game.over) return;
        const target = event.target.closest('.cell');
        if (!target) return;
        event.preventDefault();
        chordReveal(Number(target.dataset.index));
      });

      // roving tabindex
      dom.board.addEventListener('focusin', (event) => {
        const target = event.target.closest('.cell');
        if (!target) return;
        cells.forEach((cell) => { cell.tabIndex = -1; });
        target.tabIndex = 0;
      });

      // 键盘导航：方向键移动，F 放/收小苹果，Enter/Space 翻开。
      dom.board.addEventListener('keydown', (event) => {
        if (!game) return;
        const target = event.target.closest('.cell');
        if (!target) return;

        const index = Number(target.dataset.index);
        const row = Math.floor(index / game.cols);
        const col = index % game.cols;
        let nextIndex = null;

        switch (event.key) {
          case 'ArrowUp':
            nextIndex = row > 0 ? index - game.cols : index;
            break;
          case 'ArrowDown':
            nextIndex = row < game.rows - 1 ? index + game.cols : index;
            break;
          case 'ArrowLeft':
            nextIndex = col > 0 ? index - 1 : index;
            break;
          case 'ArrowRight':
            nextIndex = col < game.cols - 1 ? index + 1 : index;
            break;
          case 'Home':
            nextIndex = row * game.cols;
            break;
          case 'End':
            nextIndex = row * game.cols + game.cols - 1;
            break;
          case 'f':
          case 'F':
            event.preventDefault();
            if (!event.ctrlKey && !event.metaKey && !event.altKey) toggleFlag(index);
            return;
          default:
            return;
        }

        event.preventDefault();
        focusCell(nextIndex);
      });

      // 触屏长按：放 / 收小苹果
      dom.board.addEventListener('pointerdown', (event) => {
        longPressHandled = false;
        suppressContextUntil = 0;
        clearLongPress();
        if (event.pointerType !== 'touch') return;
        suppressContextUntil = Date.now() + 1000;

        if (!game || game.over || event.button !== 0) return;
        const target = event.target.closest('.cell');
        if (!target) return;

        const index = Number(target.dataset.index);
        const cell = game.grid[index];
        if (!cell || cell.revealed) return;

        pressedCell = target;
        pressStartX = event.clientX;
        pressStartY = event.clientY;
        pressedCell.classList.add('is-holding');

        pressTimer = window.setTimeout(() => {
          pressTimer = null;
          if (!game || game.over) return;
          longPressHandled = true;
          toggleFlag(index);
          if (navigator.vibrate) navigator.vibrate(10);
        }, 420);
      });

      dom.board.addEventListener('pointermove', (event) => {
        if (!pressedCell) return;
        if (
          Math.abs(event.clientX - pressStartX) > 9 ||
          Math.abs(event.clientY - pressStartY) > 9
        ) {
          clearLongPress();
        }
      });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
        dom.board.addEventListener(type, clearLongPress);
      });

      // 弹窗关闭 / Escape / 主按钮
      dom.modalClose.addEventListener('click', () => closeModal());
      dom.modal.querySelector('[data-modal-close]').addEventListener('click', () => closeModal());

      dom.modalPrimary.addEventListener('click', () => {
        if (!game) return;
        if (game.mode === 'battle') {
          dom.generateSeedBtn.click();
        } else {
          initNewGame({ mode: 'solo', rows: game.rows, cols: game.cols, mines: game.mineCount });
        }
        dom.resetBtn.focus({ preventScroll: true });
      });

      dom.copyRaceCodeBtn.addEventListener('click', async () => {
        if (!app.raceOwn) return;
        const copied = await copyText(app.raceOwn.code);
        showToast(copied
          ? '战绩码已复制，快发给TA'
          : `复制失败，请手动复制：${app.raceOwn.code}`);
      });

      dom.submitRaceCodeBtn.addEventListener('click', submitOpponentCode);
      dom.opponentCodeInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitOpponentCode();
        }
      });
      dom.opponentCodeInput.addEventListener('input', () => {
        dom.exchangeError.hidden = true;
      });

      // 全局键盘 & 弹窗焦点循环
      document.addEventListener('keydown', (event) => {
        trapModalFocus(event);
      });

      // 尺寸变化
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(() => {
          const width = dom.boardShell.clientWidth;
          if (Math.abs(width - lastShellWidth) > 1) {
            lastShellWidth = width;
            if (resizeFrame) cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(fitBoard);
          }
        });
        observer.observe(dom.boardShell);
      } else {
        window.addEventListener('resize', () => {
          if (resizeFrame) cancelAnimationFrame(resizeFrame);
          resizeFrame = requestAnimationFrame(fitBoard);
        });
      }

      // 页面刷新前关闭广播频道
      window.addEventListener('beforeunload', () => {
        if (app.channel) {
          try { app.channel.close(); } catch (error) { /* ignore */ }
        }
      });
    }

    /* =========================================================
       18. 启动
       ========================================================= */
    function boot() {
      // 初始化默认身份按钮状态
      updateIdentityUI();
      syncCustomInputs(app.soloConfig);
      initRaceChannel();
      bindEvents();

      // 默认进入轻松单机模式，20×20 / 40 雷
      initNewGame({ mode: 'solo', ...app.soloConfig });
    }

    boot();
  })();
  </script>
</body>
