<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c15">
  <meta name="description" content="凯神的扫雷乐园：软乎乎的单机扫雷，以及可共享种子的竞速对战。">
  <title>凯神的扫雷乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='.55' stop-color='%23f472b6'/%3E%3Cstop offset='1' stop-color='%233fd8e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%2305070f'/%3E%3Cpath d='M32 50S14 40 14 27c0-6 5-11 11-11 3.2 0 5.8 1.7 7 4.2 1.2-2.5 3.8-4.2 7-4.2 6 0 11 5 11 11 0 13-18 23-18 23Z' fill='url(%23g)'/%3E%3Cpath d='M20 25c1-2 3-3 5-3' stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round' fill='none' opacity='.55'/%3E%3C/svg%3E">

  <!--
    纯原生单文件小游戏：
    - 无框架、无外部字体、无 CDN、无广告、无外部跳转。
    - 单机模式：首点安全，只采用经逻辑推理验证可解的雷盘。
    - 对战模式：同一种子、同一安全起点、同一可解雷盘；每个人独立计时。
    - 纯前端无法跨设备实时通信，所以对战成绩支持两种同步方式：
      1. 同一浏览器打开两个标签页时，用 BroadcastChannel 自动交换成绩；
      2. 不同设备时，通过「战绩码」复制粘贴，自动比较用时并判定赢家。
    - 视觉：单层「极光玻璃」主题，所有颜色/圆角/字号都来自 :root 变量，
      不再靠 !important 层层覆盖，后续换肤只需改一组变量。
  -->

  <style>
    /* =========================================================
       「极光玻璃」主题 —— 单层设计系统，无 !important 互相覆盖
       ---------------------------------------------------------
       1. 设计变量
       2. 基础重置
       3. 背景：夜空 / 极光 / 星点
       4. 页面框架与页头
       5. 模式切换
       6. 主卡片
       7. 顶部 HUD：计时 / 重开 / 剩余雷数
       8. 对战面板
       9. 棋盘容器与网格
       10. 格子：未翻开 / 翻开 / 数字 / 图标
       11. 格子状态：苹果、小熊猫、踩雷、错标、起点
       12. 棋盘反馈动画
       13. 棋盘下方：状态、提示、自定义、页脚
       14. 结果弹窗
       15. 战绩码交换
       16. 飘落爱心 / Toast
       17. 响应式
       18. 降低动态效果
       ========================================================= */

    /* =========================================================
       1. 设计变量
       ========================================================= */
    :root {
      color-scheme: dark;

      /* 底色：深空蓝黑 */
      --night-0: #07080d;
      --night-1: #0a0c15;

      /* 玻璃描边 */
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);

      /* 极光点缀：字面量渐变里用同色系的浅色版本 */
      --blue-soft: #a8c4ff;
      --pink: #f472b6;
      --pink-soft: #ffa8d3;
      --cyan-soft: #8ceaf4;

      /* 文字 */
      --ink: #eef1fb;
      --ink-soft: #a7aecb;
      --ink-faint: #737c9d;
      --ink-ghost: #4d5473;

      /* 圆角 */
      --r-xl: 30px;
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;

      /* 字体 */
      --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
      --font-num: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono",
        Consolas, "Roboto Mono", monospace;

      --shadow-card: 0 34px 80px rgba(0, 0, 0, .55), 0 4px 18px rgba(0, 0, 0, .35);
    }

    /* =========================================================
       2. 基础重置
       ========================================================= */
    * {
      box-sizing: border-box;
    }

    html {
      min-width: 280px;
      min-height: 100%;
      background: var(--night-0);
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--night-0);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: none;
    }

    button:disabled {
      cursor: default;
    }

    ::selection {
      color: #0a0d1a;
      background: var(--cyan-soft);
    }

    [hidden] {
      display: none !important;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--blue-soft);
      outline-offset: 3px;
    }

    /* =========================================================
       3. 背景：夜空 / 极光 / 星点
       ========================================================= */
    body::before {
      content: "";
      position: fixed;
      z-index: -2;
      inset: 0;
      background:
        /* 真正的暗色：近乎中性的黑蓝底，只在顶部留一点冷光，其余靠照片光晕提亮 */
        radial-gradient(120% 90% at 50% -18%, rgba(118, 138, 192, .16), transparent 58%),
        radial-gradient(85% 65% at 100% 0%, rgba(140, 132, 190, .07), transparent 62%),
        radial-gradient(90% 70% at 8% 104%, rgba(130, 118, 186, .06), transparent 66%),
        linear-gradient(180deg, #0a0c15 0%, #08090f 46%, #06070c 100%);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1.4px 1.4px at 18% 22%, rgba(255, 255, 255, .55), transparent 100%),
        radial-gradient(1px 1px at 62% 12%, rgba(206, 220, 255, .45), transparent 100%),
        radial-gradient(1px 1px at 84% 46%, rgba(255, 255, 255, .35), transparent 100%),
        radial-gradient(1.2px 1.2px at 32% 74%, rgba(190, 224, 255, .40), transparent 100%),
        radial-gradient(1px 1px at 72% 84%, rgba(255, 255, 255, .30), transparent 100%);
      opacity: .42;
    }

    /* 极光浮块 */
    .ambient {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .65;
      animation: blobDrift 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    .ambient-blob.blob-1 {
      top: -16%;
      left: -12%;
      width: 46vw;
      height: 46vw;
      min-width: 320px;
      min-height: 320px;
      background: radial-gradient(circle at 40% 40%, rgba(96, 120, 186, .26), transparent 68%);
    }

    .ambient-blob.blob-2 {
      top: 18%;
      right: -16%;
      width: 44vw;
      height: 44vw;
      min-width: 300px;
      min-height: 300px;
      background: radial-gradient(circle at 55% 45%, rgba(146, 128, 190, .15), transparent 68%);
      animation-delay: -7s;
    }

    .ambient-blob.blob-3 {
      bottom: -22%;
      left: 24%;
      width: 48vw;
      height: 40vw;
      min-width: 320px;
      min-height: 280px;
      background: radial-gradient(circle at 50% 50%, rgba(108, 130, 186, .14), transparent 70%);
      animation-delay: -13s;
    }

    @keyframes blobDrift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(3%, 4%, 0) scale(1.07); }
      100% { transform: translate3d(-3%, -3%, 0) scale(1.02); }
    }

    /* 三颗漂浮的小爱心：暗色底上的低亮度装饰 */
    .ambient-heart {
      position: absolute;
      color: rgba(244, 114, 182, .30);
      filter: drop-shadow(0 0 10px rgba(244, 114, 182, .28));
      animation: heartFloat 11s ease-in-out infinite;
    }

    .ambient-heart svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ambient-heart.heart-a {
      top: 18%;
      left: 6%;
      width: 22px;
      height: 22px;
      color: rgba(244, 114, 182, .45);
    }

    .ambient-heart.heart-b {
      top: 62%;
      right: 7%;
      width: 16px;
      height: 16px;
      color: rgba(63, 216, 232, .40);
      filter: drop-shadow(0 0 10px rgba(63, 216, 232, .35));
      animation-delay: -3.6s;
    }

    .ambient-heart.heart-c {
      bottom: 11%;
      left: 15%;
      width: 13px;
      height: 13px;
      color: rgba(152, 184, 245, .42);
      filter: drop-shadow(0 0 10px rgba(152, 184, 245, .35));
      animation-delay: -7.4s;
    }

    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) rotate(-10deg); opacity: .55; }
      50% { transform: translateY(-14px) rotate(6deg); opacity: 1; }
    }

    /* =========================================================
       4. 页面框架与页头
       ========================================================= */
    .page {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 36px), 760px);
      margin: 0 auto;
      padding: clamp(26px, 5vw, 54px) 0 26px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(18px, 3vw, 28px);
      text-align: center;
    }

    /* 顶部照片的虚化光晕：用 96px 缩略图放大模糊，几乎不占体积 */
    .page::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      left: 50%;
      width: 100vw;
      height: clamp(420px, 58vh, 620px);

      filter: blur(56px) saturate(.9) brightness(.62);
      opacity: .7;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .55) 52%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .55) 52%, transparent 100%);
      pointer-events: none;
    }

    /* 页头照片：填补顶部留白，也是这一页的“主角照” */
    .hero-photo {
      position: relative;
      width: clamp(196px, 26vw, 284px);
      aspect-ratio: 1;
      margin: 0 auto clamp(18px, 2.6vw, 26px);
      padding: 0;
      border-radius: 30px;
      background: rgba(12, 16, 32, .5);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, .6),
        0 0 96px rgba(128, 162, 226, .34);
    }

    .hero-photo img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      filter: saturate(1.03) contrast(1.02);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
    }

    .hero-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(155deg,
        rgba(198, 214, 255, .65),
        rgba(255, 255, 255, .06) 46%,
        rgba(150, 190, 250, .55));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1.5px;
      pointer-events: none;
    }

    .hero-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .badge-tile {
      position: relative;
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 17px;
      background:
        radial-gradient(70% 70% at 30% 22%, rgba(255, 255, 255, .14), transparent 70%),
        rgba(255, 255, 255, .045);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .16),
        0 12px 28px rgba(0, 0, 0, .34);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .badge-tile:first-child {
      transform: rotate(-6deg);
    }

    .badge-tile:last-child {
      transform: rotate(6deg);
    }

    .badge-tile::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(150deg, rgba(62, 102, 220, .35), transparent 45%, rgba(150, 190, 250, .32));
      opacity: .55;
      pointer-events: none;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
    }

    .badge-tile svg {
      display: block;
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .4));
    }

    .badge-tile:last-child svg {
      width: 36px;
      height: 36px;
      filter:
        drop-shadow(0 0 1.8px rgba(255, 248, 240, .95))
        drop-shadow(0 3px 7px rgba(0, 0, 0, .45));
    }

    .badge-heart {
      color: var(--pink);
      font-size: 15px;
      line-height: 1;
      opacity: .85;
      text-shadow: 0 0 14px rgba(244, 114, 182, .55);
    }

    .hero h1 {
      position: relative;
      max-width: 700px;
      margin: 0;
      color: var(--ink);
      font-size: clamp(25px, 4.2vw, 37px);
      font-weight: 800;
      letter-spacing: .01em;
      line-height: 1.42;
      text-wrap: balance;
    }

    .hero h1 .title-glow {
      /* 纯 CSS 渐变标题：兼容性兜底由父级 color 承担 */
      color: var(--ink);
    }

    @supports (background-clip: text) or (-webkit-background-clip: text) {
      .hero h1 .title-glow {
        background-image: linear-gradient(100deg,
          #e8efff 0%, #b6ccff 32%, #8fb0f2 58%, #c3d6ff 82%, #e8efff 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 24px rgba(62, 102, 220, .28));
        animation: titleShimmer 16s ease-in-out infinite;
      }
    }

    @keyframes titleShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hero h1::before {
      content: "M I N E S W E E P E R";
      display: block;
      margin-bottom: 9px;
      color: rgba(152, 184, 245, .72);
      font-family: var(--font-num);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      line-height: 1.2;
      -webkit-text-fill-color: rgba(152, 184, 245, .72);
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--ink-faint);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .12em;
      line-height: 1.7;
    }

    .subtitle .sparkle {
      display: inline-block;
      margin-left: 3px;
      color: var(--pink-soft);
      font-size: 12px;
      filter: drop-shadow(0 0 8px rgba(244, 114, 182, .55));
    }

    /* =========================================================
       5. 模式切换
       ========================================================= */
    .mode-tabs {
      position: relative;
      display: inline-flex;
      margin-top: 20px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .04);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .07),
        0 10px 26px rgba(0, 0, 0, .26);
      isolation: isolate;
    }

    .mode-tab {
      position: relative;
      z-index: 1;
      min-width: 116px;
      padding: 9px 20px;
      border-radius: 999px;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .04em;
      line-height: 1.2;
      transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
    }

    .mode-tab:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .05);
    }

    .mode-tab[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(135deg, rgba(88, 130, 244, .96), rgba(26, 50, 134, .96));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .28),
        0 8px 22px rgba(139, 92, 246, .35);
    }

    .mode-tab:active {
      transform: scale(.985);
    }

    /* 支持 :has 时，用一块滑动的光块代替直接换背景 */
    @supports selector(:has(*)) {
      .mode-tabs::before {
        content: "";
        position: absolute;
        z-index: 0;
        top: 5px;
        left: 5px;
        width: calc((100% - 10px) / 2);
        height: calc(100% - 10px);
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(88, 130, 244, .96), rgba(26, 50, 134, .96));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .28),
          0 8px 22px rgba(139, 92, 246, .35);
        transition: transform .34s cubic-bezier(.34, .08, .22, 1);
      }

      .mode-tabs:has(#battleTab[aria-pressed="true"])::before {
        transform: translateX(100%);
      }

      .mode-tab[aria-pressed="true"] {
        background: transparent;
        box-shadow: none;
      }

      .mode-tab[aria-pressed="true"]:hover {
        background: rgba(255, 255, 255, .06);
      }
    }

    /* =========================================================
       6. 主卡片
       ========================================================= */
    .game-card {
      position: relative;
      padding: clamp(14px, 2.6vw, 22px);
      border: 1px solid transparent;
      border-radius: var(--r-xl);
      background:
        linear-gradient(158deg, rgba(21, 24, 40, .94), rgba(8, 10, 18, .97)) padding-box,
        linear-gradient(150deg, rgba(120, 162, 245, .6), rgba(150, 186, 240, .22) 42%, rgba(70, 110, 210, .5)) border-box;
      box-shadow:
        var(--shadow-card),
        0 0 70px rgba(109, 92, 255, .10);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      backdrop-filter: blur(18px) saturate(120%);
    }

    /* 卡片顶部的一道极光高光 */
    .game-card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 14%;
      width: 72%;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(152, 184, 245, .85), rgba(140, 234, 244, .7), transparent);
      opacity: .8;
      pointer-events: none;
    }

    /* =========================================================
       7. 顶部 HUD：计时 / 重开 / 剩余雷数
       ========================================================= */
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-card {
      display: flex;
      min-width: 0;
      flex: 1 1 0;
      align-items: center;
      gap: 11px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background:
        radial-gradient(80% 120% at 0% 0%, rgba(255, 255, 255, .07), transparent 70%),
        rgba(255, 255, 255, .035);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .stat-card.mine-stat {
      flex-direction: row-reverse;
      text-align: right;
      background:
        radial-gradient(80% 120% at 100% 0%, rgba(244, 114, 182, .10), transparent 70%),
        rgba(255, 255, 255, .035);
    }

    .stat-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(155deg, rgba(78, 118, 232, .34), rgba(88, 148, 232, .16));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .10),
        0 6px 16px rgba(0, 0, 0, .28);
    }

    .stat-card.mine-stat .stat-icon {
      background: linear-gradient(155deg, rgba(244, 114, 182, .28), rgba(255, 176, 122, .16));
    }

    .stat-icon svg {
      display: block;
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .35));
    }

    .stat-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }

    .stat-label {
      overflow: hidden;
      color: #8b93b5;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .14em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stat-value {
      color: var(--ink);
      font-family: var(--font-num);
      font-size: clamp(18px, 3vw, 23px);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.2;
      text-shadow: 0 0 18px rgba(152, 184, 245, .35);
      white-space: nowrap;
    }

    .mine-stat .stat-value {
      text-shadow: 0 0 18px rgba(244, 114, 182, .32);
    }

    .stat-value.bump {
      animation: numberBump .3s cubic-bezier(.3, .9, .3, 1.3);
    }

    @keyframes numberBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    /* 圆形重开按钮，放在两枚数据牌中间 */
    .reset-button {
      position: relative;
      display: grid;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 50%;
      color: #fff;
      background:
        radial-gradient(60% 60% at 32% 26%, rgba(255, 255, 255, .32), transparent 70%),
        linear-gradient(150deg, rgba(96, 140, 248, .98), rgba(24, 48, 132, .96));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .40),
        0 12px 28px rgba(124, 92, 246, .38),
        0 0 0 1px rgba(255, 255, 255, .04);
      cursor: pointer;
      transition:
        transform .28s cubic-bezier(.3, .9, .3, 1.2),
        box-shadow .28s ease,
        filter .28s ease;
    }

    .reset-button::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: inherit;
      border: 1px solid rgba(152, 184, 245, .28);
      opacity: 0;
      transform: scale(.92);
      transition: opacity .28s ease, transform .28s ease;
      pointer-events: none;
    }

    .reset-button:hover {
      transform: translateY(-2px) scale(1.03);
      filter: saturate(115%) brightness(106%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .45),
        0 18px 38px rgba(124, 92, 246, .5),
        0 0 24px rgba(244, 114, 182, .32);
    }

    .reset-button:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    .reset-button:active {
      transform: translateY(0) scale(.96);
    }

    .reset-icon {
      display: block;
      width: 23px;
      height: 23px;
      color: #fff;
      filter: drop-shadow(0 1px 3px rgba(40, 20, 80, .45));
      transition: transform .5s cubic-bezier(.4, .1, .2, 1);
    }

    .reset-button:hover .reset-icon {
      transform: rotate(-180deg);
    }

    .reset-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      z-index: 10;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(16, 20, 38, .96);
      color: var(--ink-soft);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 5px);
      transition: opacity .2s ease, transform .2s ease;
      white-space: nowrap;
    }

    .reset-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(16, 20, 38, .96);
      transform: translate(-50%, -4px) rotate(45deg);
    }

    .reset-button:hover .reset-tooltip,
    .reset-button:focus-visible .reset-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       8. 对战面板
       ========================================================= */
    .battle-panel {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(120, 162, 245, .16);
      border-radius: var(--r-lg);
      background:
        radial-gradient(90% 120% at 0% 0%, rgba(62, 102, 220, .14), transparent 65%),
        rgba(255, 255, 255, .025);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .battle-panel:not([hidden]) {
      animation: panelIn .32s cubic-bezier(.2, .8, .3, 1) both;
    }

    @keyframes panelIn {
      0% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .battle-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .identity-group {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .battle-label {
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .identity-options {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, .22);
    }

    .identity-chip {
      padding: 5px 12px;
      border-radius: 999px;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .identity-chip:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .06);
    }

    .identity-chip[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(135deg, rgba(78, 118, 232, .9), rgba(58, 128, 226, .62));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25),
        0 5px 14px rgba(109, 92, 255, .28);
    }

    .identity-chip:disabled {
      opacity: .5;
    }

    .seed-current {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--ink-faint);
      font-size: 10px;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .active-seed {
      padding: 3px 9px;
      border: 1px dashed rgba(140, 234, 244, .35);
      border-radius: 7px;
      background: rgba(63, 216, 232, .07);
      color: var(--cyan-soft);
      font-family: var(--font-num);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    .battle-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .battle-btn {
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: rgba(255, 255, 255, .05);
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.2;
      transition:
        background-color .18s ease,
        color .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
      white-space: nowrap;
    }

    .battle-btn:hover {
      color: var(--ink);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, .09);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
      transform: translateY(-1px);
    }

    .battle-btn:active {
      transform: translateY(1px);
    }

    .battle-btn.primary {
      border-color: rgba(62, 102, 220, .55);
      background: linear-gradient(135deg, rgba(78, 118, 232, .92), rgba(24, 46, 124, .94));
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .22),
        0 8px 22px rgba(109, 92, 255, .28);
    }

    .battle-btn.primary:hover {
      filter: brightness(1.08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .28),
        0 12px 28px rgba(139, 92, 246, .42);
    }

    .battle-btn:disabled {
      opacity: .45;
      transform: none;
      box-shadow: none;
    }

    .seed-join {
      display: flex;
      min-width: 250px;
      flex: 1 1 260px;
      align-items: center;
      gap: 7px;
    }

    .seed-input {
      width: 100%;
      min-width: 0;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, .28);
      color: var(--ink);
      font-family: var(--font-num);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .1em;
      outline: none;
      text-transform: uppercase;
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .seed-input::placeholder {
      color: var(--ink-ghost);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .02em;
    }

    .seed-input:focus {
      border-color: rgba(62, 102, 220, .65);
      background: rgba(62, 102, 220, .08);
      box-shadow: 0 0 0 3px rgba(62, 102, 220, .14);
    }

    .seed-input.is-error {
      border-color: rgba(248, 113, 113, .70);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, .12);
    }

    .seed-feedback {
      margin: 8px 2px 0;
      color: #fca5a5;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.5;
    }

    .battle-tip {
      margin: 10px 2px 0;
      color: #7f88ab;
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1.7;
    }

    .race-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 11px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, .22);
    }

    .race-dock-text {
      color: var(--ink-soft);
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.55;
    }

    .race-dock-btn {
      min-height: 28px;
      padding: 5px 11px;
      border: 1px solid rgba(63, 216, 232, .35);
      border-radius: 8px;
      background: rgba(63, 216, 232, .10);
      color: var(--cyan-soft);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
      white-space: nowrap;
    }

    .race-dock-btn:hover {
      background: rgba(63, 216, 232, .2);
      box-shadow: 0 0 16px rgba(63, 216, 232, .2);
      transform: translateY(-1px);
    }

    /* =========================================================
       9. 棋盘容器与网格
       ========================================================= */
    .board-shell {
      position: relative;
      width: 100%;
      margin-top: 14px;
      padding: clamp(8px, 1.5vw, 12px);
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 22px;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(62, 102, 220, .10), transparent 60%),
        radial-gradient(120% 90% at 50% 100%, rgba(63, 216, 232, .06), transparent 62%),
        #05070f;
      box-shadow:
        inset 0 2px 16px rgba(0, 0, 0, .55),
        inset 0 1px 0 rgba(255, 255, 255, .05);
      scrollbar-width: thin;
      scrollbar-color: rgba(62, 102, 220, .45) transparent;
    }

    .board-shell::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .board-shell::-webkit-scrollbar-track {
      background: transparent;
    }

    .board-shell::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(62, 102, 220, .45);
      background-clip: padding-box;
    }

    .board {
      --cell: 30px;
      --gap: 5px;
      display: grid;
      width: max-content;
      margin-inline: auto;
      padding: 2px;
      grid-template-columns: repeat(var(--cols, 20), var(--cell));
      gap: var(--gap);
      transition: opacity .2s ease;
    }

    .board.is-generating {
      opacity: .5;
    }

    /* =========================================================
       10. 格子：未翻开 / 翻开 / 数字 / 图标
       ========================================================= */
    .cell {
      position: relative;
      display: grid;
      width: var(--cell);
      height: var(--cell);
      padding: 0;
      overflow: hidden;
      place-items: center;
      border: 0;
      border-radius: clamp(5px, calc(var(--cell) * .30), 9px);
      background: rgba(6, 9, 20, .62);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .035);
      color: var(--ink-soft);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition:
        transform .16s ease,
        background-color .2s ease,
        box-shadow .2s ease;
    }

    /* 未翻开格子的立体盖片：翻开时淡出并轻微收缩 */
    .cell::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(158deg, #38406f 0%, #2d3459 46%, #232949 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 -1px 0 rgba(0, 0, 0, .38),
        inset 0 0 0 1px rgba(255, 255, 255, .05);
      opacity: 1;
      transform: scale(1);
      transition:
        opacity .3s ease,
        transform .3s ease,
        background-color .2s ease,
        filter .2s ease;
      pointer-events: none;
    }

    .cell.is-revealed {
      /* 翻开后完全让位给棋盘底色：一整片「挖空」的深色区域，数字浮在上面 */
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    .cell.is-revealed::before {
      opacity: 0;
      transform: scale(.88);
      transition-delay: var(--reveal-delay, 0ms);
    }

    .cell.is-flagged::before {
      background: linear-gradient(158deg, #37497f 0%, #2b3a6b 48%, #222d55 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 -1px 0 rgba(0, 0, 0, .35),
        inset 0 0 0 1px rgba(150, 190, 250, .22);
    }

    .cell:focus-visible {
      z-index: 5;
      outline: 2px solid var(--blue-soft);
      outline-offset: 2px;
    }

    .cell.is-holding {
      transform: scale(.93);
      box-shadow: 0 0 0 2px rgba(152, 184, 245, .45);
    }

    @media (hover: hover) and (pointer: fine) {
      .board:not(.is-over) .cell:not(.is-revealed):hover {
        z-index: 3;
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0, 0, 0, .42);
      }

      .board:not(.is-over) .cell:not(.is-revealed):hover::before {
        background: linear-gradient(158deg, #3b4375 0%, #2f3760 46%, #242a4e 100%);
        filter: brightness(1.06);
      }

      .board.is-over .cell {
        cursor: default;
      }
    }

    .board:not(.is-over) .cell:not(.is-revealed):active {
      transform: scale(.94);
    }

    .cell-content {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      pointer-events: none;
    }

    .cell-number {
      color: var(--num-color, #c3cbf0);
      font-family: var(--font-num);
      font-size: calc(var(--cell) * .58);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      text-shadow: 0 0 12px var(--num-glow, transparent);
    }

    .cell-number.n1 { --num-color: #78c8ff; --num-glow: rgba(120, 200, 255, .55); }
    .cell-number.n2 { --num-color: #7ee0a5; --num-glow: rgba(126, 224, 165, .5); }
    .cell-number.n3 { --num-color: #ffa8ab; --num-glow: rgba(255, 168, 171, .5); }
    .cell-number.n4 { --num-color: #c2a8ff; --num-glow: rgba(194, 168, 255, .55); }
    .cell-number.n5 { --num-color: #ffcf7a; --num-glow: rgba(255, 207, 122, .5); }
    .cell-number.n6 { --num-color: #7ce8dc; --num-glow: rgba(124, 232, 220, .5); }
    .cell-number.n7 { --num-color: #ffa6dd; --num-glow: rgba(255, 166, 221, .5); }
    .cell-number.n8 { --num-color: #d7ddf5; --num-glow: rgba(215, 221, 245, .45); }

    .just-opened .cell-number {
      animation: numberPop .34s cubic-bezier(.2, .9, .3, 1.15) var(--reveal-delay, 0ms) both;
    }

    @keyframes numberPop {
      0% { opacity: 0; transform: translateY(3px) scale(.82); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 小熊猫 & 小苹果 */
    .cell-icon {
      display: block;
      width: 84%;
      height: 84%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .45));
      pointer-events: none;
    }

    .cell .slipper-icon {
      width: 92%;
      height: 92%;
      /* 用户的苹果图是深色描边，加一圈极细的暖白边 + 投影，深色格子上才不会糊 */
      filter:
        drop-shadow(0 0 1px rgba(255, 248, 240, .95))
        drop-shadow(0 2px 3px rgba(0, 0, 0, .45));
      animation: iconPop .26s cubic-bezier(.2, .9, .3, 1.3) both;
    }

    .cell .panda-icon {
      width: 90%;
      height: 90%;
      filter: drop-shadow(0 0 7px rgba(255, 150, 120, .30));
      animation: iconPop .3s cubic-bezier(.2, .9, .3, 1.2) var(--mine-delay, 0ms) both;
    }

    .just-opened .cell-icon {
      animation: iconPop .3s cubic-bezier(.2, .9, .3, 1.2) var(--reveal-delay, 0ms) both;
    }

    @keyframes iconPop {
      0% { opacity: 0; transform: scale(.72); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* =========================================================
       11. 格子状态：苹果、小熊猫、踩雷、错标、起点
       ========================================================= */
    .cell.is-flagged {
      color: var(--cyan-soft);
    }

    .cell.is-mine::before,
    .cell.is-wrong::before,
    .cell.is-hit::before {
      opacity: 1;
      transform: none;
    }

    .cell.is-mine::before {
      background: linear-gradient(158deg, #432437 0%, #361d2d 50%, #2a1725 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .12),
        inset 0 0 0 1px rgba(255, 138, 138, .16);
    }

    .cell.is-wrong::before {
      background: linear-gradient(158deg, #2c2438 0%, #241e2f 50%, #1c1726 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .10),
        inset 0 0 0 1px rgba(248, 113, 113, .22);
    }

    .cell.is-wrong .slipper-icon {
      opacity: .38;
      filter: grayscale(.35) drop-shadow(none);
      transform: scale(.82) rotate(-8deg);
    }

    .cell.is-hit {
      z-index: 4;
    }

    .cell.is-hit::before {
      background: linear-gradient(158deg, #5a2233 0%, #45202c 50%, #331a24 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 0 0 1px rgba(255, 120, 120, .55),
        0 0 20px rgba(248, 113, 113, .45);
      animation: hitPulse .6s ease-out both;
    }

    @keyframes hitPulse {
      0% { box-shadow: inset 0 0 0 1px rgba(255, 210, 210, .9), 0 0 0 rgba(248, 113, 113, .9); }
      100% { box-shadow: inset 0 0 0 1px rgba(255, 120, 120, .55), 0 0 20px rgba(248, 113, 113, .45); }
    }

    .wrong-mark {
      position: absolute;
      right: 8%;
      bottom: 6%;
      z-index: 3;
      display: grid;
      width: calc(var(--cell) * .38);
      height: calc(var(--cell) * .38);
      place-items: center;
      border-radius: 50%;
      background: #f87171;
      color: #2a0c12;
      box-shadow: 0 0 10px rgba(248, 113, 113, .55);
      font-family: var(--font-num);
      font-size: calc(var(--cell) * .26);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    /* 数字周围旗帜数不对：轻微左右晃动 */
    .cell.is-nope {
      animation: nopeNudge .26s ease;
    }

    @keyframes nopeNudge {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-2px); }
      65% { transform: translateX(2px); }
    }

    /* 安全起点：青色描边 + 呼吸的圆点（都画在盖片之上，才不会被遮住） */
    .cell.is-start::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center,
        var(--cyan-soft) 0 max(2px, calc(var(--cell) * .07)),
        rgba(63, 216, 232, .55) max(2.5px, calc(var(--cell) * .09)),
        transparent max(3.5px, calc(var(--cell) * .16)));
      box-shadow: inset 0 0 0 2px rgba(63, 216, 232, .55);
      animation: startBreathe 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    .cell.is-start.is-revealed::after {
      opacity: 0;
      animation: none;
    }

    @keyframes startBreathe {
      0%, 100% { opacity: .50; }
      50% { opacity: 1; }
    }

    /* =========================================================
       12. 棋盘反馈动画
       ========================================================= */
    .board-shell[data-effect="open"] {
      animation: boardNudge .32s ease-out;
    }

    .board-shell[data-effect="lose"] {
      animation: boardShake .56s ease-out;
    }

    .board-shell[data-effect="win"] {
      animation: boardLift .95s ease-out;
    }

    .board-shell[data-effect="lose"]::after,
    .board-shell[data-effect="win"]::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
    }

    .board-shell[data-effect="lose"]::after {
      background: radial-gradient(ellipse at center, rgba(248, 113, 113, .30), transparent 70%);
      animation: loseFlash .56s ease-out;
    }

    .board-shell[data-effect="win"]::after {
      background: linear-gradient(110deg, transparent 34%, rgba(140, 234, 244, .45) 50%, rgba(152, 184, 245, .35) 56%, transparent 68%);
      background-size: 250% 100%;
      animation: winSweep .95s ease-out;
    }

    @keyframes boardNudge {
      0%, 100% { transform: translate(0, 0); }
      30% { transform: translate(-1px, 1px); }
      60% { transform: translate(1px, -1px); }
    }

    @keyframes boardShake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      15% { transform: translate(-6px, 3px) rotate(-.35deg); }
      30% { transform: translate(6px, -3px) rotate(.35deg); }
      48% { transform: translate(-4px, 2px) rotate(-.2deg); }
      65% { transform: translate(3px, -1px) rotate(.15deg); }
      82% { transform: translate(-1px, 1px) rotate(0); }
    }

    @keyframes loseFlash {
      0%, 100% { opacity: 0; }
      18% { opacity: 1; }
    }

    @keyframes boardLift {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.008); }
    }

    @keyframes winSweep {
      0% { opacity: 0; background-position: 130% 0; }
      20%, 70% { opacity: 1; }
      100% { opacity: 0; background-position: -30% 0; }
    }

    /* 通关后整片安全区柔和呼吸 */
    .board.is-cleared .cell.is-revealed {
      animation: clearedGlow 1.4s ease both;
    }

    @keyframes clearedGlow {
      0%, 100% { background-color: transparent; }
      45% { background-color: rgba(63, 216, 232, .14); }
    }

    /* =========================================================
       13. 棋盘下方：状态、提示、自定义、页脚
       ========================================================= */
    .below-board {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 13px;
      padding: 0 3px;
    }

    .status {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.6;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--blue-soft);
      box-shadow: 0 0 10px rgba(152, 184, 245, .8);
    }

    .status[data-mood="idle"] .status-dot {
      background: var(--ink-faint);
      box-shadow: 0 0 8px rgba(115, 124, 157, .5);
    }

    .status[data-mood="play"] .status-dot {
      background: var(--cyan-soft);
      box-shadow: 0 0 10px rgba(63, 216, 232, .8);
      animation: dotBreathe 2s ease-in-out infinite;
    }

    .status[data-mood="win"] .status-dot {
      background: #7ee0a5;
      box-shadow: 0 0 12px rgba(126, 224, 165, .9);
    }

    .status[data-mood="lose"] .status-dot {
      background: #f87171;
      box-shadow: 0 0 12px rgba(248, 113, 113, .85);
    }

    @keyframes dotBreathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.82); }
    }

    .control-hint {
      margin: 0;
      color: #6d7698;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1.65;
      text-align: right;
    }

    .touch-hint {
      display: none;
    }

    .customizer {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px dashed rgba(255, 255, 255, .09);
    }

    .customizer summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 3px 0;
      color: var(--ink-faint);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .05em;
      list-style: none;
      transition: color .18s ease;
    }

    .customizer summary::-webkit-details-marker {
      display: none;
    }

    .customizer summary::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
      transition: transform .22s ease;
    }

    .customizer[open] summary::after {
      transform: translateY(1px) rotate(-135deg);
    }

    .customizer summary:hover {
      color: var(--ink-soft);
    }

    .custom-form {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, .2);
      animation: panelIn .26s ease both;
    }

    .custom-field {
      display: flex;
      min-height: 34px;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      background: rgba(255, 255, 255, .05);
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      transition: border-color .18s ease, background-color .18s ease;
    }

    .custom-field input {
      width: 34px;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-num);
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .custom-field input.mines {
      width: 40px;
    }

    .custom-field input::-webkit-outer-spin-button,
    .custom-field input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .custom-field:focus-within {
      border-color: rgba(62, 102, 220, .55);
      background: rgba(62, 102, 220, .10);
    }

    .custom-field input.is-invalid {
      color: #fca5a5;
    }

    .apply-button {
      min-height: 34px;
      padding: 6px 14px;
      border: 1px solid rgba(62, 102, 220, .40);
      border-radius: var(--r-sm);
      background: rgba(62, 102, 220, .18);
      color: var(--blue-soft);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .apply-button:hover {
      background: rgba(62, 102, 220, .30);
      box-shadow: 0 0 18px rgba(62, 102, 220, .25);
      transform: translateY(-1px);
    }

    .form-error {
      flex-basis: 100%;
      margin: 0;
      padding: 3px 4px 0;
      color: #fca5a5;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 20px;
      color: var(--ink-ghost);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .08em;
      line-height: 1.6;
      text-align: center;
    }

    .footer-heart {
      color: rgba(244, 114, 182, .55);
      font-size: 12px;
      line-height: 1;
      text-shadow: 0 0 10px rgba(244, 114, 182, .5);
    }

    /* =========================================================
       14. 结果弹窗
       ========================================================= */
    body.has-modal {
      overflow: hidden;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      pointer-events: none;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 10, .62);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
      backdrop-filter: blur(6px) saturate(120%);
      opacity: 0;
      pointer-events: auto;
      transition: opacity .32s ease;
    }

    .modal.is-open .modal-backdrop {
      opacity: 1;
    }

    .modal-card {
      position: relative;
      z-index: 2;
      width: min(430px, 100%);
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      overflow: auto;
      padding: 26px 26px 24px;
      border: 1px solid transparent;
      border-radius: 26px;
      background:
        linear-gradient(165deg, rgba(28, 32, 58, .96), rgba(9, 12, 24, .98)) padding-box,
        linear-gradient(155deg, rgba(152, 184, 245, .6), rgba(63, 216, 232, .22) 45%, rgba(244, 114, 182, .5)) border-box;
      box-shadow:
        0 40px 100px rgba(0, 0, 0, .65),
        0 0 80px rgba(109, 92, 255, .16),
        inset 0 1px 0 rgba(255, 255, 255, .09);
      opacity: 0;
      pointer-events: auto;
      transform: translateY(20px) scale(.96);
      transition:
        opacity .32s ease,
        transform .38s cubic-bezier(.2, .85, .3, 1.05);
      scrollbar-width: thin;
      scrollbar-color: rgba(62, 102, 220, .45) transparent;
    }

    .modal.is-open .modal-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .modal-inner {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      z-index: 5;
      top: 13px;
      right: 14px;
      display: grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .05);
      color: var(--ink-faint);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 19px;
      font-weight: 300;
      line-height: 1;
      transition: background-color .18s ease, color .18s ease, transform .18s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, .12);
      color: var(--ink);
      transform: rotate(90deg);
    }

    .modal-mascot {
      position: relative;
      display: grid;
      width: 84px;
      height: 84px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(70% 70% at 35% 25%, rgba(255, 255, 255, .18), transparent 70%),
        rgba(255, 255, 255, .05);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .16),
        0 14px 34px rgba(0, 0, 0, .4),
        0 0 40px rgba(62, 102, 220, .22);
    }

    .modal-mascot::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: conic-gradient(from 120deg, rgba(78, 118, 232, .8), rgba(80, 160, 240, .55), rgba(150, 190, 250, .75), rgba(78, 118, 232, .8));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1.5px;
      opacity: .85;
      pointer-events: none;
    }

    .modal-card.is-win .modal-mascot {
      color: var(--pink-soft);
    }

    .modal-art {
      display: block;
      width: 54px;
      height: 54px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .4));
    }

    .modal-card.is-win .modal-art {
      animation: mascotBreathe 2.2s ease-in-out infinite;
    }

    @keyframes mascotBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .modal-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(21px, 4.8vw, 27px);
      font-weight: 800;
      letter-spacing: .01em;
      line-height: 1.42;
      text-wrap: balance;
    }

    .modal-desc {
      margin: 10px auto 0;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.85;
      white-space: pre-line;
    }

    .modal-note {
      margin: 12px 0 0;
      color: var(--ink-faint);
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 1.6;
    }

    .modal-note:empty {
      display: none;
    }

    .modal-primary {
      min-width: 148px;
      min-height: 44px;
      margin-top: 18px;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(88, 130, 244, .96), rgba(26, 50, 134, .96));
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .30),
        0 14px 32px rgba(124, 92, 246, .38);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.2;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .modal-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .34),
        0 20px 42px rgba(124, 92, 246, .5);
    }

    .modal-primary:active {
      transform: translateY(0) scale(.98);
    }

    .modal-card.is-lose .modal-primary {
      background: linear-gradient(135deg, rgba(56, 92, 202, .92), rgba(28, 52, 140, .92));
    }

    /* =========================================================
       15. 战绩码交换
       ========================================================= */
    .race-exchange {
      margin: 16px 0 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, .24);
      text-align: left;
    }

    .exchange-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .exchange-row + .exchange-row {
      margin-top: 8px;
    }

    .exchange-label {
      flex: 0 0 auto;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .my-code {
      display: block;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: var(--cyan-soft);
      font-family: var(--font-num);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-copy-btn,
    .exchange-submit {
      min-height: 29px;
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid rgba(62, 102, 220, .35);
      border-radius: 8px;
      background: rgba(62, 102, 220, .16);
      color: var(--blue-soft);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .mini-copy-btn:hover,
    .exchange-submit:hover {
      background: rgba(62, 102, 220, .28);
      box-shadow: 0 0 16px rgba(62, 102, 220, .22);
      transform: translateY(-1px);
    }

    .opponent-code-input {
      min-width: 0;
      height: 31px;
      flex: 1;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, .32);
      color: var(--ink);
      font-family: var(--font-num);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      outline: none;
      text-transform: uppercase;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .opponent-code-input::placeholder {
      color: var(--ink-ghost);
      font-family: var(--font-ui);
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .opponent-code-input:focus {
      border-color: rgba(62, 102, 220, .6);
      box-shadow: 0 0 0 3px rgba(62, 102, 220, .12);
    }

    .exchange-help {
      margin: 9px 0 0;
      color: var(--ink-ghost);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.6;
    }

    .exchange-error {
      margin: 7px 0 0;
      color: #fca5a5;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.5;
    }

    /* 弹窗里的飘落爱心 */
    .modal-hearts {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
    }

    .modal-heart {
      position: absolute;
      top: -24px;
      color: rgba(244, 114, 182, .55);
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(244, 114, 182, .35));
      animation-name: modalHeartFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .modal-heart svg,
    .falling-heart svg,
    .heart-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes modalHeartFall {
      0% { opacity: 0; transform: translate3d(0, -10px, 0) rotate(-8deg) scale(.85); }
      12% { opacity: .85; }
      80% { opacity: .5; }
      100% { opacity: 0; transform: translate3d(var(--heart-drift, 12px), 520px, 0) rotate(14deg) scale(1); }
    }

    /* =========================================================
       16. 飘落爱心 / Toast
       ========================================================= */
    .falling-hearts {
      position: fixed;
      z-index: 90;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-heart {
      position: absolute;
      top: -30px;
      color: rgba(244, 114, 182, .5);
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(244, 114, 182, .4));
      animation-name: pageHeartFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      pointer-events: none;
      will-change: transform, opacity;
    }

    @keyframes pageHeartFall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(-8deg); }
      10% { opacity: .85; }
      82% { opacity: .45; }
      100% { opacity: 0; transform: translate3d(var(--heart-drift, 30px), 110vh, 0) rotate(22deg); }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 150;
      max-width: calc(100% - 32px);
      padding: 10px 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18, 22, 42, .92);
      color: var(--ink);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, .55),
        0 0 24px rgba(62, 102, 220, .18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .02em;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .24s ease, transform .24s ease;
      white-space: nowrap;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       17. 响应式
       ========================================================= */
    @media (max-width: 680px) {
      .page {
        width: min(calc(100% - 22px), 760px);
        padding-top: 24px;
      }

      .hero {
        margin-bottom: 16px;
      }

      .hero-badge {
        gap: 8px;
        margin-bottom: 12px;
      }

      .badge-tile {
        width: 44px;
        height: 44px;
        border-radius: 14px;
      }

      .badge-tile svg {
        width: 27px;
        height: 27px;
      }

      .badge-tile:last-child svg {
        width: 30px;
        height: 30px;
      }

      .hero h1 {
        max-width: 430px;
        font-size: clamp(22px, 6.2vw, 29px);
        line-height: 1.5;
      }

      .hero h1::before {
        margin-bottom: 7px;
        font-size: 8px;
        letter-spacing: .16em;
      }

      .subtitle {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: .08em;
      }

      .mode-tabs {
        width: min(300px, 100%);
        margin-top: 15px;
      }

      .mode-tab {
        min-width: 0;
        flex: 1;
        padding: 8px 10px;
        font-size: 11.5px;
      }

      .game-card {
        padding: 12px;
        border-radius: 24px;
      }

      .hud {
        gap: 7px;
      }

      .stat-card {
        gap: 8px;
        padding: 7px 10px;
        border-radius: 15px;
      }

      .stat-icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
      }

      .stat-icon svg {
        width: 21px;
        height: 21px;
      }

      .stat-label {
        font-size: 8px;
        letter-spacing: .1em;
      }

      .stat-value {
        font-size: clamp(16px, 4.6vw, 19px);
      }

      .reset-button {
        width: 46px;
        height: 46px;
      }

      .reset-icon {
        width: 19px;
        height: 19px;
      }

      .reset-tooltip {
        display: none;
      }

      .battle-panel {
        margin-top: 11px;
        padding: 11px;
        border-radius: 16px;
      }

      .battle-head {
        gap: 7px;
      }

      .identity-group {
        gap: 5px;
      }

      .battle-label {
        font-size: 9px;
      }

      .identity-chip {
        padding: 4px 10px;
        font-size: 10px;
      }

      .seed-current {
        gap: 5px;
        font-size: 9px;
      }

      .active-seed {
        padding: 2px 7px;
        font-size: 10.5px;
      }

      .battle-controls {
        gap: 6px;
        margin-top: 9px;
      }

      .battle-btn {
        min-height: 33px;
        padding: 6px 10px;
        font-size: 10.5px;
      }

      .seed-join {
        min-width: 200px;
        flex-basis: 210px;
        gap: 6px;
      }

      .seed-input {
        height: 33px;
        padding-inline: 9px;
        font-size: 10.5px;
      }

      .battle-tip {
        font-size: 9px;
        line-height: 1.6;
      }

      .race-dock {
        padding: 8px 9px;
      }

      .race-dock-text {
        font-size: 9.5px;
      }

      .board-shell {
        margin-top: 11px;
        padding: 7px;
        border-radius: 17px;
      }

      .below-board {
        margin-top: 11px;
        gap: 5px;
      }

      .status {
        flex: 1 1 100%;
        font-size: 10.5px;
      }

      .control-hint {
        flex: 1 1 100%;
        font-size: 9px;
        text-align: left;
      }

      .desktop-hint {
        display: none;
      }

      .touch-hint {
        display: inline;
      }

      .customizer {
        margin-top: 11px;
        padding-top: 9px;
      }

      .customizer summary {
        font-size: 9.5px;
      }

      .custom-form {
        gap: 6px;
        padding: 9px;
      }

      .custom-field {
        min-height: 31px;
        padding: 2px 7px;
        font-size: 9px;
      }

      .custom-field input {
        width: 29px;
        font-size: 11.5px;
      }

      .custom-field input.mines {
        width: 34px;
      }

      .apply-button {
        min-height: 31px;
        padding: 5px 10px;
        font-size: 9.5px;
      }

      .footer {
        margin-top: 16px;
        font-size: 9px;
      }

      .modal {
        padding: 16px;
      }

      .modal-card {
        width: min(410px, 100%);
        padding: 22px 17px 20px;
        border-radius: 22px;
      }

      .modal-mascot {
        width: 72px;
        height: 72px;
        margin-bottom: 12px;
      }

      .modal-art {
        width: 46px;
        height: 46px;
      }

      .modal-desc {
        font-size: 12px;
      }

      .modal-title {
        font-size: clamp(20px, 6vw, 25px);
      }

      .modal-primary {
        min-height: 41px;
      }

      .toast {
        bottom: 20px;
        font-size: 10.5px;
        white-space: normal;
        text-align: center;
      }

      .ambient-heart.heart-a {
        left: 2%;
        width: 16px;
        height: 16px;
      }

      .ambient-heart.heart-b {
        right: 4%;
        width: 12px;
        height: 12px;
      }

      .ambient-heart.heart-c {
        display: none;
      }
    }

    @media (max-width: 400px) {
      .page {
        width: calc(100% - 16px);
      }

      .stat-card {
        padding: 6px 8px;
        gap: 6px;
      }

      .stat-icon {
        width: 27px;
        height: 27px;
        border-radius: 8px;
      }

      .stat-icon svg {
        width: 19px;
        height: 19px;
      }

      .reset-button {
        width: 42px;
        height: 42px;
      }

      .stat-label {
        display: none;
      }
    }

    /* =========================================================
       18. 降低动态效果
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }

      .ambient-blob,
      .ambient-heart,
      .falling-heart,
      .modal-heart {
        animation: none !important;
      }

      .falling-hearts,
      .modal-hearts {
        display: none;
      }

      .board-shell[data-effect],
      .board-shell[data-effect]::after {
        animation: none !important;
      }

      .cell.is-start::after {
        opacity: .9;
        transform: none;
      }
    }

    /* 手机端照片稍小一点 */
    @media (max-width: 680px) {
      .hero-photo {
        width: clamp(168px, 42vw, 208px);
        margin-bottom: 16px;
        border-radius: 26px;
      }
    }

  </style>
</head>

      <h1><span class="title-glow">凯神的扫雷乐园</span></h1>
      <p class="subtitle">给扫雷高手凯凯<span class="sparkle">✨</span></p>

      <div class="mode-tabs" role="group" aria-label="选择游戏模式">
        <button class="mode-tab" id="soloTab" type="button" data-mode="solo" aria-pressed="true">单机模式</button>
        <button class="mode-tab" id="battleTab" type="button" data-mode="battle" aria-pressed="false">对战模式</button>
      </div>
    </header>

    <main class="game-card">
      <!-- 顶部 HUD：计时器 · 重新开始 · 剩余地雷 -->
      <div class="hud" aria-label="游戏数据">
        <div class="stat-card">
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><use href="#icon-clock"></use></svg>
          </span>
          <span class="stat-copy">
            <span class="stat-label">时间</span>
            <output class="stat-value" id="timer" aria-label="计时器">00:00</output>
          </span>
        </div>

        <button class="reset-button" id="resetBtn" type="button"
                aria-label="重新开始"
                aria-describedby="resetTooltip">
          <svg class="reset-icon" viewBox="0 0 64 64" aria-hidden="true">
            <use href="#icon-refresh"></use>
          </svg>
          <span class="reset-tooltip" id="resetTooltip" role="tooltip">再来一局挑战凯凯</span>
        </button>

        <div class="stat-card mine-stat">
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><use href="#icon-panda"></use></svg>
          </span>
          <span class="stat-copy">
            <span class="stat-label">剩余小熊猫</span>
            <output class="stat-value" id="mineCounter" aria-label="剩余地雷">040</output>
          </span>
        </div>
      </div>

      <!-- 对战模式控制区 -->
      <section class="battle-panel" id="battlePanel" hidden aria-label="种子竞速对战设置">
        <div class="battle-head">
          <div class="identity-group">
            <span class="battle-label">我是</span>
            <div class="identity-options" role="group" aria-label="选择玩家身份">
              <button class="identity-chip" type="button" data-player="kaikai" aria-pressed="false">凯凯</button>
              <button class="identity-chip" type="button" data-player="tuoxie" aria-pressed="true">拖鞋</button>
            </div>
          </div>

          <div class="seed-current">
            <span>本局种子</span>
            <code class="active-seed" id="activeSeed">—</code>
          </div>
        </div>

        <div class="battle-controls">
          <button class="battle-btn primary" id="generateSeedBtn" type="button">生成对战种子</button>
          <button class="battle-btn" id="copySeedBtn" type="button" disabled>复制种子</button>

          <form class="seed-join" id="seedJoinForm" novalidate>
            <input class="seed-input" id="seedInput" type="text" maxlength="12"
                   placeholder="输入对方发来的种子"
                   autocomplete="off" autocapitalize="characters" spellcheck="false"
                   aria-label="输入对战种子">
            <button class="battle-btn" id="joinSeedBtn" type="submit">加入对局</button>
          </form>
        </div>

        <p class="seed-feedback" id="seedFeedback" role="alert" hidden></p>
        <p class="battle-tip">
          轻松推理 · 20×20 / 40 雷。先点亮框起点，双方从同一安全格开始，无需猜雷。生成棋盘不计时。重新开始会生成新种子，请分享给对方加入新局。
        </p>

        <div class="race-dock" id="raceDock" hidden>
          <span class="race-dock-text" id="raceDockText"></span>
          <button class="race-dock-btn" id="openRaceResultBtn" type="button">查看结算</button>
        </div>
      </section>

      <!-- 雷区 -->
      <section class="board-shell" id="boardShell" aria-label="雷区">
        <div class="board" id="board" role="group" aria-label="扫雷棋盘" aria-describedby="boardHelp"></div>
      </section>

      <div class="below-board">
        <p class="status" id="statusText" data-mood="idle">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusLabel">第一格安全 · 每局均经逻辑验证，无需猜雷</span>
        </p>
        <p class="control-hint" id="boardHelp">
          <span class="desktop-hint">左键翻开 · 右键放 / 收小苹果 · 双击数字快速展开</span>
          <span class="touch-hint">轻点翻开 · 长按放 / 收小苹果 · 大棋盘可左右滑动</span>
        </p>
      </div>

      <!-- 单人自定义棋盘（对战固定 20×20/40，统一起点） -->
      <details class="customizer" id="customizer">
        <summary>想换一张棋盘？自定义单机雷区</summary>
        <form class="custom-form" id="customForm" novalidate>
          <label class="custom-field">
            行
            <input id="rowsInput" type="number" min="5" max="30" step="1" value="20" inputmode="numeric" autocomplete="off" aria-label="行数">
          </label>
          <label class="custom-field">
            列
            <input id="colsInput" type="number" min="5" max="30" step="1" value="20" inputmode="numeric" autocomplete="off" aria-label="列数">
          </label>
          <label class="custom-field">
            雷
            <input class="mines" id="minesInput" type="number" min="1" step="1" value="40" inputmode="numeric" autocomplete="off" aria-label="地雷数">
          </label>
          <button class="apply-button" type="submit">布置新雷区</button>
          <p class="form-error" id="customError" role="alert" hidden></p>
        </form>
      </details>
    </main>

    <footer class="footer">
      <span class="footer-heart" aria-hidden="true">♡</span>
      <!-- 签名：chris -->
      <span>拖鞋&凯凯</span>
      <span class="footer-heart" aria-hidden="true">♡</span>
    </footer>
  </div>

  <!-- 页面飘落爱心层（胜利彩蛋） -->
  <div class="falling-hearts" id="fallingHearts" aria-hidden="true"></div>

  <!-- 结果弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"
         aria-labelledby="modalTitle" aria-describedby="modalDesc" tabindex="-1">
      <div class="modal-hearts" id="modalHearts" aria-hidden="true"></div>
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭弹窗">×</button>
      <div class="modal-inner">
        <div class="modal-mascot" id="modalMascot" aria-hidden="true"></div>
        <h2 class="modal-title" id="modalTitle">太棒啦！🎉</h2>
        <p class="modal-desc" id="modalDesc"></p>

        <div class="race-exchange" id="raceExchange" hidden>

            <button class="mini-copy-btn" id="copyRaceCodeBtn" type="button">复制</button>

            <label class="sr-only" for="opponentCodeInput">粘贴对方的战绩码</label>
            <input class="opponent-code-input" id="opponentCodeInput" type="text"

            <button class="exchange-submit" id="submitRaceCodeBtn" type="button">自动结算</button>

          <p class="exchange-error" id="exchangeError" role="alert" hidden></p>
          <p class="exchange-help">

        <button class="modal-primary" id="modalPrimary" type="button">再来一局</button>
        <p class="modal-note" id="modalNote"></p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      modalClose: document.getElementById('modalClose'),
