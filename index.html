<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#25211e">
  <meta name="description" content="凯神的扫雷乐园：软乎乎的单机扫雷，以及可共享种子的竞速对战。">
  <title>凯神的扫雷乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23eaf5fa'/%3E%3Cpath d='M32 50S14 40 14 27c0-6 5-11 11-11 3.2 0 5.8 1.7 7 4.2 1.2-2.5 3.8-4.2 7-4.2 6 0 11 5 11 11 0 13-18 23-18 23Z' fill='%23d8a2a2'/%3E%3C/svg%3E">

  <!--
    纯原生单文件小游戏：
    - 无框架、无外部字体、无 CDN、无广告、无外部跳转。
    - 单机模式：随机雷盘，首点安全。
    - 对战模式：同一串种子生成完全相同的雷盘；每个人独立计时。
    - 纯前端无法跨设备实时通信，所以对战成绩支持两种同步方式：
      1. 同一浏览器打开两个标签页时，用 BroadcastChannel 自动交换成绩；
      2. 不同设备时，通过「战绩码」复制粘贴，自动比较用时并判定赢家。
  -->

  <style>
    /* =========================================================
       1. 配色变量 & 基础样式
       ========================================================= */
    :root {
      /* 奶白主底、浅雾蓝信息色、樱花粉点缀，全部低饱和 */
      --cream: #fffdfa;
      --cream-strong: #ffffff;
      --cream-deep: #fbf6f1;
      --rose: #e9c0c4;
      --rose-deep: #c8959b;
      --rose-soft: #f9e6e9;
      --rose-pale: #fdf5f7;
      --peach: #f0e2d8;
      --peach-soft: #f8f2ec;
      --ink: #7b6c68;
      --ink-soft: #9a8b87;
      --ink-faint: #b6a9a4;
      --line: #e6eef2;
      --shadow-soft: 0 24px 70px rgba(150, 168, 178, .12);
      --sky: #dcecf4;
      --sky-soft: #f2f9fc;
      --sky-deep: #9cb7c6;

      /* 统一圆角：卡片大、容器中、按钮与格子小 */
      --radius-card: 30px;
      --radius-panel: 18px;
      --radius-control: 14px;
      --radius-chip: 10px;

      --font-rounded: "Nunito", "Varela Round", "Avenir Next",
        "Hiragino Maru Gothic ProN", "PingFang SC", "Microsoft YaHei",
        "Hiragino Sans GB", sans-serif;
      --font-num: "Arial Rounded MT Bold", "Trebuchet MS", "Nunito",
        var(--font-rounded);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 280px;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background-color: #f8fbfe;
      background-image:
        radial-gradient(circle at 7% 6%, rgba(211, 235, 245, .78), transparent 30%),
        radial-gradient(circle at 94% 13%, rgba(250, 232, 235, .5), transparent 27%),
        radial-gradient(circle at 83% 88%, rgba(224, 242, 249, .7), transparent 32%),
        radial-gradient(rgba(146, 181, 198, .15) 1px, transparent 1.2px);
      background-size: auto, auto, auto, 26px 26px;
      font-family: var(--font-rounded);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--rose-deep);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
    }

    ::selection {
      color: var(--ink);
      background: #f4d7d3;
    }

    [hidden] {
      display: none !important;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* =========================================================
       2. 背景装饰 & 页面框架
       ========================================================= */
    .ambient {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .75;
    }

    .ambient-blob.blob-1 {
      top: -120px;
      left: -130px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(247, 221, 215, .8), transparent 68%);
    }

    .ambient-blob.blob-2 {
      top: 26%;
      right: -190px;
      width: 470px;
      height: 470px;
      background: radial-gradient(circle, rgba(248, 229, 213, .72), transparent 68%);
    }

    .ambient-blob.blob-3 {
      bottom: -180px;
      left: 22%;
      width: 420px;
      height: 360px;
      background: radial-gradient(circle, rgba(247, 225, 223, .55), transparent 70%);
    }

    .ambient-heart {
      position: absolute;
      color: rgba(221, 168, 162, .32);
      animation: ambientFloat 8s ease-in-out infinite;
    }

    .ambient-heart svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ambient-heart.heart-a {
      top: 16%;
      left: 5%;
      width: 23px;
      height: 23px;
      transform: rotate(-12deg);
    }

    .ambient-heart.heart-b {
      top: 62%;
      right: 6%;
      width: 16px;
      height: 16px;
      color: rgba(228, 186, 170, .4);
      animation-delay: -2.7s;
    }

    .ambient-heart.heart-c {
      bottom: 10%;
      left: 12%;
      width: 13px;
      height: 13px;
      color: rgba(223, 177, 174, .28);
      animation-delay: -5s;
    }

    @keyframes ambientFloat {
      0%, 100% { transform: translateY(0) rotate(-8deg); opacity: .65; }
      50% { transform: translateY(-12px) rotate(4deg); opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 32px), 820px);
      margin: 0 auto;
      padding: clamp(24px, 4.3vw, 44px) 0 22px;
    }

    /* =========================================================
       3. 页头 / 标题 / 模式切换
       ========================================================= */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(18px, 3vw, 26px);
      text-align: center;
    }

    .hero-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 13px;
    }

    .badge-tile {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 250, 244, .9);
      box-shadow:
        0 8px 20px rgba(178, 139, 128, .13),
        inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .badge-tile:first-child {
      transform: rotate(-5deg);
    }

    .badge-tile:last-child {
      background: var(--rose-soft);
      transform: rotate(5deg);
    }

    .badge-tile svg {
      display: block;
      width: 27px;
      height: 27px;
    }

    .badge-heart {
      color: var(--rose-deep);
      font-size: 13px;
      line-height: 1;
      opacity: .8;
    }

    .hero h1 {
      max-width: 760px;
      margin: 0;
      color: #79635d;
      font-size: clamp(24px, 4.1vw, 36px);
      font-weight: 800;
      letter-spacing: .015em;
      line-height: 1.42;
      text-wrap: balance;
    }

    .hero h1 .couple {
      color: var(--rose-deep);
      white-space: nowrap;
    }

    .hero h1 .x-mark {
      margin: 0 .22em;
      color: #c7a69c;
      font-weight: 600;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      line-height: 1.7;
    }

    .subtitle .sparkle {
      display: inline-block;
      margin-left: 2px;
      color: #d8b47f;
      font-size: 12px;
    }

    .mode-tabs {
      display: inline-flex;
      gap: 4px;
      margin-top: 16px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(246, 232, 225, .82);
      box-shadow:
        inset 0 1px 3px rgba(177, 138, 126, .08),
        0 1px 0 rgba(255, 255, 255, .8);
    }

    .mode-tab {
      min-width: 112px;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .035em;
      line-height: 1;
      transition:
        color .18s ease,
        background-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
    }

    .mode-tab:hover {
      color: var(--ink);
      background: rgba(255, 250, 245, .55);
    }

    .mode-tab[aria-pressed="true"] {
      background: var(--cream-strong);
      color: var(--rose-deep);
      box-shadow:
        0 5px 14px rgba(186, 145, 135, .13),
        inset 0 1px 0 #fff;
    }

    .mode-tab:active {
      transform: scale(.98);
    }

    /* =========================================================
       4. 主卡片
       ========================================================= */
    .game-card {
      position: relative;
      padding: clamp(16px, 3vw, 24px);
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 32px;
      background: rgba(255, 252, 247, .84);
      box-shadow:
        var(--shadow-soft),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    /* =========================================================
       5. 顶部状态：计时器 / 剩余地雷 / 重置
       ========================================================= */
    .game-top {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
    }

    .stat-card {
      display: flex;
      min-width: 152px;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 20px;
      background: var(--peach-soft);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .85),
        0 4px 12px rgba(177, 139, 127, .045);
    }

    .stat-card.mine-stat {
      background: var(--rose-pale);
      flex-direction: row-reverse;
      text-align: right;
    }

    .stat-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 251, 246, .85);
      box-shadow:
        inset 0 1px 0 #fff,
        0 4px 9px rgba(184, 147, 135, .08);
    }

    .stat-icon svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    .stat-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      color: var(--ink-faint);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .stat-value {
      color: #6f5953;
      font-family: var(--font-num);
      font-size: clamp(18px, 2.8vw, 22px);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: .035em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .stat-value.bump {
      animation: numberBump .26s ease-out;
    }

    @keyframes numberBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .reset-row {
      display: flex;
      justify-content: center;
      margin: 12px 0 14px;
    }

    .reset-button {
      position: relative;
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      gap: 7px;
      padding: 8px 17px;
      border: 0;
      border-radius: 999px;
      background: #f8ebe5;
      color: #9c7d75;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .85),
        0 4px 12px rgba(183, 143, 131, .08);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      transition:
        background-color .2s ease,
        color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
    }

    .reset-button:hover {
      background: #edcbc6;
      color: #765853;
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .7),
        0 8px 20px rgba(193, 143, 135, .22);
    }

    .reset-button:active {
      transform: translateY(1px);
    }

    .reset-icon {
      display: block;
      width: 16px;
      height: 16px;
      color: currentColor;
      transition: transform .4s ease;
    }

    .reset-button:hover .reset-icon {
      transform: rotate(-180deg);
    }

    .reset-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 10;
      padding: 5px 9px;
      border-radius: 8px;
      background: #7d6861;
      color: #fffaf4;
      box-shadow: 0 8px 20px rgba(117, 88, 81, .2);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: .03em;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: opacity .18s ease, transform .18s ease;
      white-space: nowrap;
    }

    .reset-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #7d6861;
      transform: translate(-50%, -3px) rotate(45deg);
      border-radius: 1px;
    }

    .reset-button:hover .reset-tooltip,
    .reset-button:focus-visible .reset-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       6. 对战模式面板
       ========================================================= */
    .battle-panel {
      margin-bottom: 15px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(251, 240, 234, .8);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .86),
        inset 0 -1px 0 rgba(229, 205, 195, .3);
    }

    .battle-panel:not([hidden]) {
      animation: panelIn .26s ease both;
    }

    @keyframes panelIn {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .battle-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .identity-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .battle-label {
      color: var(--ink-faint);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .identity-options {
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 251, 246, .6);
    }

    .identity-chip {
      padding: 5px 11px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .identity-chip:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .55);
    }

    .identity-chip[aria-pressed="true"] {
      background: var(--rose-soft);
      color: #8e625d;
      box-shadow: 0 3px 8px rgba(187, 142, 134, .1);
    }

    .identity-chip:disabled {
      opacity: .55;
    }

    .seed-current {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-faint);
      font-size: 9.5px;
      white-space: nowrap;
    }

    .active-seed {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 251, 247, .65);
      color: #a4736c;
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
    }

    .battle-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .battle-btn {
      min-height: 34px;
      padding: 7px 12px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 251, 247, .8);
      color: var(--ink-soft);
      box-shadow:
        inset 0 1px 0 #fff,
        0 3px 8px rgba(191, 153, 140, .07);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.2;
      transition:
        background-color .18s ease,
        color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
      white-space: nowrap;
    }

    .battle-btn:hover {
      color: var(--ink);
      background: #fffaf6;
      box-shadow:
        inset 0 1px 0 #fff,
        0 6px 14px rgba(191, 153, 140, .12);
      transform: translateY(-1px);
    }

    .battle-btn:active {
      transform: translateY(1px);
    }

    .battle-btn.primary {
      background: var(--rose-soft);
      color: #87615b;
    }

    .battle-btn.primary:hover {
      background: #f1d6d2;
    }

    .battle-btn:disabled {
      opacity: .5;
      transform: none;
      box-shadow: inset 0 1px 0 #fff;
    }

    .seed-join {
      display: flex;
      min-width: 238px;
      flex: 1 1 250px;
      align-items: center;
      gap: 6px;
    }

    .seed-input {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 251, 247, .85);
      color: var(--ink);
      box-shadow:
        inset 0 0 0 1px rgba(235, 217, 207, .9),
        inset 0 1px 2px rgba(183, 143, 131, .06);
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      outline: none;
      text-transform: uppercase;
      transition: box-shadow .18s ease, background-color .18s ease;
    }

    .seed-input::placeholder {
      color: #b9a29a;
      font-family: var(--font-rounded);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .seed-input:focus {
      background: #fffdfa;
      box-shadow:
        inset 0 0 0 1.5px var(--rose),
        0 0 0 3px rgba(232, 184, 179, .16);
    }

    .seed-input.is-error {
      box-shadow:
        inset 0 0 0 1.5px #dba39b,
        0 0 0 3px rgba(219, 163, 155, .12);
    }

    .seed-feedback {
      margin: 7px 2px 0;
      color: #aa6c65;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.5;
    }

    .battle-tip {
      margin: 8px 2px 0;
      color: var(--ink-faint);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: .02em;
      line-height: 1.6;
    }

    .race-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 13px;
      background: rgba(253, 244, 240, .82);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
    }

    .race-dock-text {
      color: #92766e;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.5;
    }

    .race-dock-btn {
      min-height: 26px;
      padding: 5px 9px;
      border: 0;
      border-radius: 8px;
      background: #f0d4d0;
      color: #7e5b55;
      cursor: pointer;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      transition: background-color .18s ease, transform .18s ease;
      white-space: nowrap;
    }

    .race-dock-btn:hover {
      background: #e8c2bd;
      transform: translateY(-1px);
    }

    /* =========================================================
       7. 棋盘
       ========================================================= */
    .board-shell {
      width: 100%;
      padding: clamp(7px, 1.4vw, 10px);
      overflow: auto;
      overscroll-behavior: contain;
      border-radius: 26px;
      background: linear-gradient(145deg, #f9ebe5, #f6e5de);
      box-shadow:
        inset 0 2px 9px rgba(176, 136, 124, .075),
        inset 0 -1px 0 rgba(255, 255, 255, .78);
      scrollbar-width: thin;
      scrollbar-color: #d9b6ae #f6e5de;
    }

    .board-shell::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .board-shell::-webkit-scrollbar-track {
      background: transparent;
    }

    .board-shell::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: #d9b6ae;
      background-clip: padding-box;
    }

    .board {
      --cell: 30px;
      --gap: 4px;
      display: grid;
      width: max-content;
      margin-inline: auto;
      padding: 2px;
      grid-template-columns: repeat(var(--cols, 20), var(--cell));
      gap: var(--gap);
    }

    .cell {
      position: relative;
      display: grid;
      width: var(--cell);
      height: var(--cell);
      padding: 0;
      overflow: hidden;
      place-items: center;
      border: 0;
      border-radius: clamp(5px, calc(var(--cell) * .32), 10px);
      background: #fffbf7;
      box-shadow:
        0 2px 5px rgba(190, 149, 136, .14),
        0 0 0 1px rgba(255, 255, 255, .32) inset;
      color: var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background-color .22s ease;
    }

    /* 未翻开格子的柔和覆盖层：翻开时淡出，不闪烁 */
    .cell::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: inherit;
      background-color: #f3dbcf;
      background-image: linear-gradient(150deg, rgba(255, 255, 255, .52), rgba(202, 150, 136, .045));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .65),
        inset 0 -1px 0 rgba(196, 154, 142, .13);
      opacity: 1;
      transform: scale(1);
      transition:
        opacity .34s ease,
        transform .34s ease,
        background-color .2s ease;
      pointer-events: none;
    }

    .cell.is-revealed {
      background: #fffbf7;
      box-shadow:
        inset 0 0 0 1px rgba(238, 222, 211, .72),
        0 1px 2px rgba(196, 163, 151, .035);
      cursor: default;
    }

    .cell.is-revealed::before {
      opacity: 0;
      transform: scale(.86);
      transition-delay: var(--reveal-delay, 0ms);
    }

    .cell.is-flagged::before {
      background-color: #f5dfdd;
      background-image: linear-gradient(150deg, rgba(255, 255, 255, .45), rgba(206, 154, 150, .035));
    }

    .cell.is-mine::before,
    .cell.is-wrong::before,
    .cell.is-hit::before {
      opacity: 1;
      transform: none;
      background-color: #f8e7e1;
      background-image: linear-gradient(150deg, rgba(255, 255, 255, .55), rgba(210, 157, 146, .04));
    }

    .cell.is-hit {
      z-index: 3;
      box-shadow:
        0 0 0 2px rgba(207, 126, 118, .4),
        0 6px 16px rgba(205, 138, 131, .22);
    }

    .cell.is-hit::before {
      background-color: #f4d1cb;
      box-shadow: inset 0 0 0 1px rgba(209, 140, 132, .16);
    }

    .cell.is-wrong::before {
      background-color: #fbebe7;
    }

    .cell:focus-visible {
      z-index: 5;
      outline: 2px solid var(--rose-deep);
      outline-offset: 2px;
    }

    .cell.is-holding {
      transform: scale(.94);
      box-shadow: 0 3px 9px rgba(200, 151, 143, .16);
    }

    /* 只在有鼠标的设备上使用上浮柔光，避免触屏出现粘滞 hover */
    @media (hover: hover) and (pointer: fine) {
      .board:not(.is-over) .cell:not(.is-revealed):hover {
        z-index: 3;
        transform: translateY(-2px);
        box-shadow:
          0 9px 20px rgba(219, 169, 162, .32),
          0 2px 6px rgba(201, 154, 144, .1);
      }

      .board:not(.is-over) .cell:not(.is-revealed):hover::before {
        background-color: #fae5e2;
      }

      .board.is-over .cell {
        cursor: default;
      }
    }

    /* 已翻开的数字内容 */
    .cell-content {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      pointer-events: none;
    }

    .cell-number {
      color: #97837b;
      font-family: var(--font-num);
      font-size: calc(var(--cell) * .52);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: -.03em;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
    }

    /* 数字颜色：柔和区分，不用深色粗体 */
    .cell-number.n1 { color: #829aa6; }
    .cell-number.n2 { color: #86a48b; }
    .cell-number.n3 { color: #c4837c; }
    .cell-number.n4 { color: #a08bb8; }
    .cell-number.n5 { color: #b6906b; }
    .cell-number.n6 { color: #7fa59e; }
    .cell-number.n7 { color: #a48490; }
    .cell-number.n8 { color: #8f7c76; }

    .just-opened .cell-number {
      animation: softAppear .32s ease var(--reveal-delay, 0ms) both;
    }

    @keyframes softAppear {
      0% { opacity: 0; transform: translateY(2px) scale(.88); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 小熊猫 & 小拖鞋图标 */
    .cell-icon {
      display: block;
      width: 82%;
      height: 82%;
      filter: drop-shadow(0 2px 2px rgba(181, 135, 127, .12));
      pointer-events: none;
    }

    .cell .slipper-icon {
      width: 96%;
      height: 96%;
      animation: softPop .28s ease-out both;
    }

    .cell .panda-icon {
      width: 88%;
      height: 88%;
      animation: softPop .3s ease-out var(--mine-delay, 0ms) both;
    }

    .just-opened .cell-icon {
      animation: softPop .3s ease-out var(--reveal-delay, 0ms) both;
    }

    @keyframes softPop {
      0% { opacity: 0; transform: scale(.78); }
      100% { opacity: 1; transform: scale(1); }
    }

    .cell.is-wrong .slipper-icon {
      opacity: .36;
      transform: scale(.82) rotate(-8deg);
    }

    .wrong-mark {
      position: absolute;
      right: 11%;
      bottom: 9%;
      z-index: 3;
      display: grid;
      width: calc(var(--cell) * .35);
      height: calc(var(--cell) * .35);
      place-items: center;
      border-radius: 50%;
      background: #eab4ad;
      color: #fffaf4;
      font-family: var(--font-rounded);
      font-size: calc(var(--cell) * .24);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    /* 数字周围旗帜不对时的轻微提示 */
    .cell.is-nope {
      animation: softNope .24s ease;
    }

    @keyframes softNope {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2px); }
    }

    /* 翻开后的整片区域柔和入场 */
    .board.is-cleared .cell.is-revealed {
      animation: boardGlow 1.1s ease both;
    }

    @keyframes boardGlow {
      0% { box-shadow: inset 0 0 0 1px rgba(238, 222, 211, .72); }
      45% { box-shadow: inset 0 0 0 1px rgba(232, 192, 184, .75), 0 0 12px rgba(238, 196, 188, .16); }
      100% { box-shadow: inset 0 0 0 1px rgba(238, 222, 211, .72); }
    }

    /* =========================================================
       8. 状态 / 操作提示 / 自定义棋盘
       ========================================================= */
    .below-board {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px 14px;
      margin-top: 12px;
      padding: 0 3px;
    }

    .status {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.55;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #d7aea7;
      box-shadow: 0 0 0 3px rgba(233, 196, 190, .2);
    }

    .status[data-mood="play"] .status-dot {
      background: #c8a8a0;
      animation: dotBreathe 2s ease-in-out infinite;
    }

    .status[data-mood="win"] .status-dot {
      background: #a9c5ac;
      box-shadow: 0 0 0 3px rgba(169, 197, 172, .18);
    }

    .status[data-mood="lose"] .status-dot {
      background: #d5a29c;
      box-shadow: 0 0 0 3px rgba(213, 162, 156, .16);
    }

    @keyframes dotBreathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    .control-hint {
      margin: 0;
      color: var(--ink-faint);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: .015em;
      line-height: 1.55;
      text-align: right;
    }

    .touch-hint { display: none; }

    .customizer {
      margin-top: 13px;
      padding-top: 10px;
      border-top: 1px dashed rgba(226, 207, 197, .8);
    }

    .customizer summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 3px 0;
      color: var(--ink-faint);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .03em;
      list-style: none;
      transition: color .18s ease;
    }

    .customizer summary::-webkit-details-marker { display: none; }

    .customizer summary::after {
      content: "⌄";
      display: inline-block;
      color: #c3aba1;
      font-size: 11px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .customizer[open] summary::after {
      transform: rotate(180deg);
    }

    .customizer summary:hover { color: var(--ink-soft); }

    .custom-form {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(252, 242, 236, .65);
    }

    .custom-field {
      display: flex;
      min-height: 32px;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255, 252, 248, .8);
      color: var(--ink-faint);
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .custom-field input {
      width: 32px;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-num);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .custom-field input.mines { width: 38px; }

    .custom-field input::-webkit-outer-spin-button,
    .custom-field input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .custom-field:focus-within {
      box-shadow: 0 0 0 2px rgba(232, 184, 179, .45);
    }

    .custom-field input.is-invalid {
      color: #b46d65;
    }

    .apply-button {
      min-height: 32px;
      padding: 6px 12px;
      border: 0;
      border-radius: 10px;
      background: #f0d4d0;
      color: #7e5b55;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      transition: background-color .18s ease, transform .18s ease;
    }

    .apply-button:hover {
      background: #e8c2bd;
      transform: translateY(-1px);
    }

    .form-error {
      flex-basis: 100%;
      margin: 0;
      padding: 3px 4px 0;
      color: #a96860;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
    }

    /* =========================================================
       9. 页脚
       ========================================================= */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
      color: #b29b92;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 1.6;
      text-align: center;
    }

    .footer-heart {
      color: rgba(214, 167, 161, .7);
      font-size: 11px;
      line-height: 1;
    }

    /* =========================================================
       10. 结果弹窗
       ========================================================= */
    body.has-modal {
      overflow: hidden;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      pointer-events: none;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(112, 87, 81, .28);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: auto;
      transition: opacity .3s ease;
    }

    .modal.is-open .modal-backdrop {
      opacity: 1;
    }

    .modal-card {
      position: relative;
      z-index: 2;
      width: min(430px, 100%);
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      overflow: auto;
      padding: 24px 26px 22px;
      border-radius: 30px;
      background: #fffaf5;
      box-shadow:
        0 30px 90px rgba(134, 98, 91, .25),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      opacity: 0;
      pointer-events: auto;
      transform: translateY(18px) scale(.97);
      transition:
        opacity .3s ease,
        transform .34s cubic-bezier(.2, .8, .3, 1.08);
      scrollbar-width: thin;
      scrollbar-color: #d9b6ae transparent;
    }

    .modal.is-open .modal-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .modal-card.is-win {
      background: #fff3f2;
    }

    .modal-card.is-lose {
      background: #fffaf5;
    }

    .modal-inner {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 13px;
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 253, 249, .55);
      color: #b39e95;
      cursor: pointer;
      font-family: var(--font-rounded);
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
      transition: background-color .18s ease, color .18s ease;
    }

    .modal-close:hover {
      background: #f3dfda;
      color: #84665f;
    }

    .modal-mascot {
      display: grid;
      width: 78px;
      height: 78px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 252, 247, .76);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .9),
        0 10px 25px rgba(190, 144, 136, .11);
    }

    .modal-card.is-win .modal-mascot {
      background: rgba(255, 250, 246, .6);
      color: #e3aea9;
    }

    .modal-card.is-lose .modal-mascot {
      background: rgba(253, 244, 239, .7);
    }

    .modal-mascot svg {
      display: block;
      width: 52px;
      height: 52px;
    }

    .modal-card.is-win .modal-mascot svg {
      animation: heartBreathe 2.1s ease-in-out infinite;
    }

    @keyframes heartBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.055); }
    }

    .modal-title {
      margin: 0;
      color: #7c635c;
      font-size: clamp(22px, 4.7vw, 28px);
      font-weight: 800;
      letter-spacing: .015em;
      line-height: 1.4;
      text-wrap: balance;
    }

    .modal-desc {
      margin: 9px auto 0;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.8;
      white-space: pre-line;
    }

    .modal-note {
      margin: 11px 0 0;
      color: var(--ink-faint);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .02em;
      line-height: 1.6;
    }

    .modal-note:empty {
      display: none;
    }

    .modal-primary {
      min-width: 138px;
      min-height: 41px;
      margin-top: 16px;
      padding: 9px 21px;
      border: 0;
      border-radius: 999px;
      background: #edccc7;
      color: #755650;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .65),
        0 6px 16px rgba(192, 141, 133, .14);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.2;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .modal-primary:hover {
      background: #e6bdb8;
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .6),
        0 9px 22px rgba(192, 141, 133, .2);
    }

    .modal-primary:active {
      transform: translateY(1px);
    }

    .modal-card.is-lose .modal-primary {
      background: #f1d9d4;
    }

    /* 对战战绩码交换区 */
    .race-exchange {
      margin: 14px 0 0;
      padding: 11px;
      border-radius: 16px;
      background: rgba(255, 252, 248, .58);
      box-shadow: inset 0 0 0 1px rgba(238, 218, 208, .7);
      text-align: left;
    }

    .exchange-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .exchange-row + .exchange-row {
      margin-top: 7px;
    }

    .exchange-label {
      flex: 0 0 auto;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .my-code {
      display: block;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #9b6d66;
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-copy-btn,
    .exchange-submit {
      min-height: 28px;
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 0;
      border-radius: 8px;
      background: #f1d8d3;
      color: #815f58;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      transition: background-color .18s ease, transform .18s ease;
    }

    .mini-copy-btn:hover,
    .exchange-submit:hover {
      background: #e8c3bd;
      transform: translateY(-1px);
    }

    .opponent-code-input {
      min-width: 0;
      height: 30px;
      flex: 1;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: #fffdfa;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(234, 215, 205, .9);
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .03em;
      outline: none;
      text-transform: uppercase;
    }

    .opponent-code-input::placeholder {
      color: #bca69d;
      font-family: var(--font-rounded);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .exchange-help {
      margin: 8px 0 0;
      color: var(--ink-faint);
      font-size: 9.5px;
      font-weight: 500;
      line-height: 1.6;
    }

    .exchange-error {
      margin: 6px 0 0;
      color: #aa665f;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* 弹窗里的飘落爱心 */
    .modal-hearts {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .modal-heart {
      position: absolute;
      top: -24px;
      color: rgba(214, 150, 145, .58);
      opacity: 0;
      animation-name: modalHeartFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .modal-heart svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes modalHeartFall {
      0% { opacity: 0; transform: translate3d(0, -10px, 0) rotate(-8deg) scale(.85); }
      12% { opacity: .9; }
      80% { opacity: .55; }
      100% { opacity: 0; transform: translate3d(var(--heart-drift, 12px), 520px, 0) rotate(14deg) scale(1); }
    }

    /* =========================================================
       11. 页面飘落爱心 & Toast
       ========================================================= */
    .falling-hearts {
      position: fixed;
      z-index: 90;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-heart {
      position: absolute;
      top: -30px;
      color: rgba(220, 169, 163, .5);
      opacity: 0;
      animation-name: pageHeartFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      pointer-events: none;
    }

    .falling-heart svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes pageHeartFall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(-8deg); }
      10% { opacity: .9; }
      82% { opacity: .5; }
      100% { opacity: 0; transform: translate3d(var(--heart-drift, 30px), 110vh, 0) rotate(22deg); }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 150;
      max-width: calc(100% - 32px);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(116, 94, 87, .92);
      color: #fffaf4;
      box-shadow: 0 12px 30px rgba(102, 77, 71, .18);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .22s ease, transform .22s ease;
      white-space: nowrap;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       12. 响应式
       ========================================================= */
    @media (max-width: 680px) {
      .page {
        width: min(calc(100% - 22px), 820px);
        padding-top: 22px;
      }

    /* =========================================================
       14. 最终视觉校准：奶白 / 浅雾蓝 / 樱花粉
       奶白负责大面积留白，浅雾蓝负责标题、信息与边界，
       樱花粉只用来点按钮、hover、爱心、拖鞋和弹窗的小情绪。
       ========================================================= */
    body {
      color: var(--ink);
      background-color: #fffdfa;
      background-image:
        radial-gradient(ellipse at 0% 10%, rgba(218, 238, 247, .44), transparent 38%),
        radial-gradient(ellipse at 100% 86%, rgba(250, 230, 234, .35), transparent 40%),
        radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, .84), transparent 63%),
        linear-gradient(110deg, #f9fcfe 0%, #fffdfa 48%, #fdf8f9 100%);
      background-attachment: fixed;
      background-size: cover;
    }

    .ambient-blob {
      opacity: .36;
    }

    .ambient-blob.blob-1 {
      background: radial-gradient(circle, rgba(215, 237, 246, .75), transparent 68%);
    }

    .ambient-blob.blob-2 {
      background: radial-gradient(circle, rgba(250, 233, 236, .68), transparent 68%);
    }

    .ambient-blob.blob-3 {
      background: radial-gradient(circle, rgba(235, 246, 251, .55), transparent 70%);
    }

    .hero h1 {
      color: #7b95a3;
      text-shadow: none;
    }

    .hero h1 .couple {
      color: #aa8085;
    }

    .hero h1 .x-mark {
      color: #b2c5cf;
    }

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {

    /* =========================================================
       15. 暖炭暗色治愈主题
       保留全部布局、尺寸与结构，只压低亮度、饱和度和高光。
       ========================================================= */
    :root {
      color-scheme: dark;
      --cream: #312d2a;
      --cream-strong: #3b3734;
      --cream-deep: #2b2724;
      --rose: #7f5f63;
      --rose-deep: #b98f94;
      --rose-soft: #4a3d3d;
      --rose-pale: #3b3433;
      --peach: #4a423b;
      --peach-soft: #3b3734;
      --ink: #c9b7aa;
      --ink-soft: #b5a299;
      --ink-faint: #8f7d76;
      --line: #55494a;
      --shadow-soft: 0 24px 64px rgba(0, 0, 0, .30);
      --sky: #4a4d50;
      --sky-soft: #353331;
      --sky-deep: #7d8a90;
    }

    html {
      color: #c9b7aa;
      background: #25211e !important;
    }

    body {
      color: #c9b7aa !important;
      background-color: #25211e !important;
      background-image:
        radial-gradient(ellipse at 8% 4%, rgba(126, 94, 92, .20), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgba(103, 84, 82, .15), transparent 40%),
        radial-gradient(ellipse at 52% 48%, rgba(86, 70, 66, .10), transparent 62%),
        linear-gradient(115deg, #25211e 0%, #292421 50%, #231f1d 100%) !important;
      background-attachment: fixed !important;
      background-size: cover !important;
    }

    ::selection {
      color: #e6d3bf !important;
      background: #5a4443 !important;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible,
    .cell:focus-visible {
      outline-color: #9f757a !important;
    }

    /* 背景装饰只保留 4% 的存在感 */
    .ambient {
      opacity: .04 !important;
    }

    .ambient-blob {
      opacity: 1 !important;
      filter: blur(26px) !important;
      animation: none !important;
    }

    .ambient-blob.blob-1 {
      background: radial-gradient(circle, rgba(192, 154, 148, .9), transparent 68%) !important;
    }

    .ambient-blob.blob-2 {
      background: radial-gradient(circle, rgba(164, 148, 146, .8), transparent 68%) !important;
    }

    .ambient-blob.blob-3 {
      background: radial-gradient(circle, rgba(158, 136, 138, .75), transparent 70%) !important;
    }

    .ambient-heart {
      opacity: 1 !important;
      color: rgba(193, 154, 150, .9) !important;
      animation: none !important;
    }

    /* 标题与页头 */
    .hero h1,
    .hero h1 .couple,
    .hero h1 .x-mark {
      color: #d8c3ae !important;
      background: none !important;
      -webkit-text-fill-color: #d8c3ae !important;
      text-shadow: none !important;
    }

    .subtitle {
      color: #b5a199 !important;
    }

    .subtitle .sparkle {
      color: #a58b72 !important;
      opacity: .55 !important;
      filter: saturate(.4) brightness(.8);
    }

    .badge-tile,
    .badge-tile:last-child {
      background: #3b3734 !important;
      border: 1px solid rgba(164, 132, 136, .16) !important;
      box-shadow:
        0 6px 14px rgba(0, 0, 0, .20),
        inset 0 1px 0 rgba(216, 196, 180, .05) !important;
    }

    .badge-tile:first-child svg {
      filter: saturate(.62) brightness(.80) contrast(1.02);
    }

    .badge-heart {
      color: #9f757a !important;
      opacity: .55 !important;
    }

    /* 模式切换 */
    .mode-tabs {
      background: #302c2a !important;
      border: 1px solid rgba(164, 132, 136, .14) !important;
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, .22),
        0 2px 6px rgba(0, 0, 0, .12) !important;
    }

    .mode-tab {
      color: #ad9a90 !important;
      background: transparent !important;
    }

    .mode-tab:hover {
      color: #cdbbae !important;
      background: #3a3532 !important;
    }

    .mode-tab[aria-pressed="true"] {
      color: #d8c3ae !important;
      background: #4a403c !important;
      box-shadow:
        inset 0 0 0 1px rgba(180, 146, 146, .16),

    /* 主卡片 */

      background: #383431 !important;
      border: 1px solid rgba(164, 132, 136, .20) !important;
      box-shadow:
        0 24px 54px rgba(0, 0, 0, .30),
        0 6px 16px rgba(0, 0, 0, .14),
        inset 0 1px 0 rgba(216, 196, 180, .04) !important;

    /* 计时器 / 剩余地雷 */
    .stat-card,
    .stat-card.mine-stat {
      background: #3b3734 !important;
      border: 1px solid rgba(164, 132, 136, .14) !important;

        inset 0 1px 0 rgba(216, 196, 180, .04) !important;

    .stat-icon {

        inset 0 1px 0 rgba(216, 196, 180, .05),

      filter: saturate(.62) brightness(.82) contrast(1.02);

    .stat-label {

    .modal-card.is-win,
    .modal-card.is-lose {

    .modal-title {

    .modal-desc {

    }

    .modal-note,
    .exchange-label,
    .exchange-help {
      color: #9d8a80 !important;
    }

    .modal-primary,
    .modal-card.is-lose .modal-primary {
      color: #e6d3bf !important;
      background: #5a4443 !important;
      border: 1px solid rgba(164, 132, 136, .16) !important;

      }

</head>
